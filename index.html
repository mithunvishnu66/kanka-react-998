  <!-- Lazy image observer -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){e.target.classList.add('loaded');obs.unobserve(e.target);}});
    }, {threshold:0.05});
    function scan(){
      document.querySelectorAll('img[loading="lazy"]:not(.loaded)').forEach(img=>{
        if(img.complete) img.classList.add('loaded');
        else { img.addEventListener('load',()=>img.classList.add('loaded')); obs.observe(img); }
      });
    }
    scan();
    new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  });
  </script>

/* ─── SUPABASE LOADER ───────────────────────────────────────────────── */
window.loadKankaData = async function loadKankaData() {
  const query =
      "select=id,slug,name,description,details,price,original_price,"
    + "category,tags,rating,review_count,is_active,"
    + "product_images(url,sort_order),"
    + "product_colors(name,hex,sort_order),"
    + "product_variants(color,size,stock,sku)"
    + "&is_active=eq.true&order=created_at.asc";

  const res = await fetch(`${SUPABASE_URL}/rest/v1/products?${query}`, {
    headers: {
      apikey:        SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${await res.text()}`);
  const rows = await res.json();
  if (!Array.isArray(rows) || rows.length === 0) throw new Error("No products in database");

  const sizeOrder = ["XS","S","M","L","XL","XXL"];

  window.PRODUCTS = rows.map((p, idx) => {
    const images = (p.product_images || [])
      .slice().sort((a,b) => a.sort_order - b.sort_order)
      .map(i => i.url);
    const colors = (p.product_colors || [])
      .slice().sort((a,b) => a.sort_order - b.sort_order)
      .map(c => ({ name: c.name, hex: c.hex }));
    const sizes  = [...new Set((p.product_variants || []).map(v => v.size))]
      .sort((a,b) => sizeOrder.indexOf(a) - sizeOrder.indexOf(b));

    const stockMap = {};
    (p.product_variants || []).forEach(v => {
      stockMap[`${v.color}__${v.size}`] = v.stock;
    });

    return {
      id:            idx + 1,                  // numeric id (1..N) — keeps existing routing working
      uuid:          p.id,                     // real DB UUID (use for orders, cart sync later)
      slug:          p.slug,
      name:          p.name,
      price:         parseFloat(p.price),
      originalPrice: p.original_price ? parseFloat(p.original_price) : null,
      discount:      (p.original_price && parseFloat(p.original_price) > parseFloat(p.price))
                       ? Math.round((1 - parseFloat(p.price) / parseFloat(p.original_price)) * 100)
                       : 0,
      category:      p.category,
      tags:          p.tags || [],
      rating:        parseFloat(p.rating) || 0,
      reviewCount:   p.review_count || 0,
      description:   p.description || "",
      details:       p.details || [],
      images:        images.length ? images : ["https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&h=1000&auto=format&fit=crop&q=80"],
      /* ProductCard reads the singular `image`. Without this the grid
         thumbnails render broken while the detail page (which reads
         images[0]) looks fine. */
      image:         images[0] || "https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&h=1000&auto=format&fit=crop&q=80",
      colors:        colors.length ? colors : [{ name:"Default", hex:"#cccccc" }],
      sizes:         sizes.length  ? sizes  : ["M"],
      stockMap,
    };
  });

  /* Build CATEGORIES dynamically from live data */
  const counts = { all: window.PRODUCTS.length };
  window.PRODUCTS.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
  window.CATEGORIES = [
    { id:"all",    label:"All Products", count: counts.all    || 0 },
    { id:"kurta",  label:"Kurta",       count: counts.kurta  || 0 },
    { id:"tshirt", label:"T-Shirt",     count: counts.tshirt || 0 },
    { id:"dhoti",  label:"Dhoti Pant",  count: counts.dhoti  || 0 },
  ];

  console.log(`[Kanka] ✓ Loaded ${window.PRODUCTS.length} products from Supabase`);
  return true;
};

/* ─── AUTHENTICATION HELPERS ────────────────────────────────────────── */
/* These use Supabase Auth REST API directly (no library).
   Session token is stored in localStorage so users stay logged in. */

const AUTH_KEY = "kanka_session";

function _getSession() {
  try {
    const s = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if (!s?.access_token || !s?.user) return null;
    // Check if JWT is expired (JWT exp is in seconds)
    try {
      const payload = JSON.parse(atob(s.access_token.split('.')[1]));
      if (payload.exp && payload.exp * 1000 < Date.now()) {
        localStorage.removeItem(AUTH_KEY);
        return null;
      }
    } catch {}
    return s;
  } catch { return null; }
}
function _saveSession(s) {
  if (s) localStorage.setItem(AUTH_KEY, JSON.stringify(s));
  else localStorage.removeItem(AUTH_KEY);
}

window.auth = {
  /* Current logged-in user (or null) */
  current: _getSession(),

  /* Sign up new user — auto-creates customer profile via DB trigger */
  async signup(email, password, fullName) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({
        email, password,
        data: { full_name: fullName },
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || "Sign-up failed");
    if (data.access_token) {
      const session = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user: data.user,
      };
      _saveSession(session);
      this.current = session;
    }
    return data;
  },

  /* Login with email + password */
  async login(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Login failed");
    const session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user: data.user,
    };
    _saveSession(session);
    this.current = session;
    return session;
  },

  /* Logout — clear stored session */
  async logout() {
    const s = this.current;
    if (s?.access_token) {
      try {
        await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${s.access_token}`,
          },
        });
      } catch {}
    }
    _saveSession(null);
    this.current = null;
  },

  /* Send password reset email */
  async resetPassword(email) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.msg || "Could not send reset email");
    }
    return true;
  },

  /* Get logged-in user's customer profile from DB */
  async getProfile() {
    if (!this.current) return null;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${this.current.user.id}&select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
      },
    });
    const rows = await res.json();
    return Array.isArray(rows) ? rows[0] : null;
  },

  /* Update profile (full_name, phone, marketing_consent) */
  async updateProfile(updates) {
    if (!this.current) throw new Error("Not logged in");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${this.current.user.id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
      },
      body: JSON.stringify(updates),
    });
    if (!res.ok) throw new Error("Failed to update profile");
    return (await res.json())[0];
  },

  /* Get user's orders */
  async getOrders() {
    if (!this.current) return [];
    const q = "select=*,order_items(*)&order=created_at.desc";
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?${q}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
      },
    });
    if (!res.ok) return [];
    return await res.json();
  },

  /* ── Address local-storage helpers ── */
  _addrKey() { return "kanka_addresses_" + (this.current?.user?.id || "guest"); },
  _localAddresses() { try { return JSON.parse(localStorage.getItem(this._addrKey()) || "[]"); } catch { return []; } },
  _saveLocalAddresses(list) { localStorage.setItem(this._addrKey(), JSON.stringify(list)); },

  /* Get user's saved addresses — tries Supabase, falls back to localStorage */
  async getAddresses() {
    if (!this.current) return [];
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/addresses?select=*&order=is_default.desc,created_at.desc`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${this.current.access_token}`,
        },
      });
      if (res.ok) {
        const remote = await res.json();
        if (Array.isArray(remote)) {
          /* Merge: remote takes priority; keep any local-only entries */
          const local = this._localAddresses();
          const remoteIds = new Set(remote.map(a => String(a.id)));
          const localOnly = local.filter(a => !remoteIds.has(String(a.id)));
          return [...remote, ...localOnly];
        }
      }
    } catch (e) { /* fall through */ }
    /* Supabase failed — return what we have locally */
    return this._localAddresses();
  },

  /* Save a new address — tries Supabase, always saves to localStorage as backup */
  async addAddress(addr) {
    if (!this.current) throw new Error("Not logged in");
    const body = { ...addr, customer_id: this.current.user.id };

    /* Optimistic local save first so the UI never appears to lose data */
    const tempId  = "local_" + Date.now();
    const localEntry = { ...addr, id: tempId, created_at: new Date().toISOString() };
    const existing   = this._localAddresses();
    this._saveLocalAddresses([localEntry, ...existing]);

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/addresses`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${this.current.access_token}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        const data   = await res.json();
        const saved  = Array.isArray(data) ? data[0] : data;
        if (saved?.id) {
          /* Replace the temp local entry with the real DB-saved one */
          const updated = this._localAddresses().map(a => a.id === tempId ? saved : a);
          this._saveLocalAddresses(updated);
          return saved;
        }
      }
      /* Supabase rejected it — keep the local entry and return it */
      console.warn("[Kanka] addAddress: Supabase returned error, using local save");
    } catch (e) {
      console.warn("[Kanka] addAddress network error:", e.message);
    }
    return localEntry;
  },

  /* Delete an address */
  async deleteAddress(id) {
    if (!this.current) throw new Error("Not logged in");
    /* Always remove from local store */
    this._saveLocalAddresses(this._localAddresses().filter(a => String(a.id) !== String(id)));
    /* Try Supabase too (non-blocking) */
    if (!String(id).startsWith("local_")) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/addresses?id=eq.${id}`, {
          method: "DELETE",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${this.current.access_token}`,
          },
        });
      } catch (e) { /* ignore */ }
    }
    return true;
  },
};

/* ─── PERSISTENT CART STORAGE ───────────────────────────────────────── */
/* Guests:       cart lives in localStorage
   Logged in:    cart syncs to Supabase cart_items table
   On login:     guest cart merges into account cart                    */

const CART_KEY = "kanka_cart";

window.cartStore = {
  /* Load cart from browser storage (works for guests + logged-in) */
  loadLocal() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch { return []; }
  },
  saveLocal(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  },
  clearLocal() {
    localStorage.removeItem(CART_KEY);
  },

  /* Load cart from Supabase (requires login) */
  async loadRemote() {
    const auth = window.auth?.current;
    if (!auth) return [];
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?select=*&order=created_at.asc`,
        { headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
      if (!res.ok) return [];
      const rows = await res.json();
      // Transform DB rows -> cart item format the React components expect
      return rows.map(r => {
        const product = window.PRODUCTS.find(p => p.uuid === r.product_id);
        if (!product) return null;
        return {
          id:       product.id,
          uuid:     product.uuid,
          cartKey:  `${product.id}__${r.color}__${r.size}`,
          name:     product.name,
          price:    product.price,
          image:    product.images[0],
          color:    r.color,
          size:     r.size,
          quantity: r.quantity,
        };
      }).filter(Boolean);
    } catch (e) {
      console.warn("[Kanka] cart loadRemote failed:", e);
      return [];
    }
  },

  /* Sync cart to Supabase (replace-all strategy: delete old, insert new) */
  async saveRemote(cart) {
    const auth = window.auth?.current;
    if (!auth) return;
    try {
      // Delete all existing cart items for this user
      await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?customer_id=eq.${auth.user.id}`,
        { method: "DELETE", headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
      if (cart.length === 0) return;

      // Build rows with proper product UUID lookup
      const rows = cart.map(item => {
        const product = window.PRODUCTS.find(p => p.id === item.id);
        if (!product?.uuid) return null;
        return {
          customer_id: auth.user.id,
          product_id:  product.uuid,
          color:       item.color,
          size:        item.size,
          quantity:    item.quantity,
        };
      }).filter(Boolean);

      if (rows.length === 0) return;
      await fetch(`${SUPABASE_URL}/rest/v1/cart_items`, {
        method: "POST",
        headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(rows),
      });
    } catch (e) {
      console.warn("[Kanka] cart saveRemote failed:", e);
    }
  },

  /* Merge two carts — sum quantities when same item exists in both */
  mergeCarts(local, remote) {
    const merged = remote.map(i => ({ ...i }));
    local.forEach(localItem => {
      const existing = merged.find(m => m.cartKey === localItem.cartKey);
      if (existing) {
        existing.quantity = Math.min(existing.quantity + localItem.quantity, 10);
      } else {
        merged.push({ ...localItem });
      }
    });
    return merged;
  },

  /* Clear cart everywhere — called after successful order */
  async clearAll() {
    this.clearLocal();
    const auth = window.auth?.current;
    if (!auth) return;
    try {
      await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?customer_id=eq.${auth.user.id}`,
        { method: "DELETE", headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
    } catch (e) {
      console.warn("[Kanka] cart clearAll failed:", e);
    }
  },
};

/* Live search suggestions — matches product names, categories and tags */
window.kkSuggest = function kkSuggest(q, limit) {
  const raw = (q || "").trim().toLowerCase();
  if (raw.length < 1) return [];
  const words = raw.split(/\s+/).filter(Boolean);
  /* Read PRODUCTS fresh on every call so anything added later — new rows
     from Supabase, admin uploads — is searchable with no code change. */
  const list = window.PRODUCTS || [];
  const scored = [];
  list.forEach(p => {
    const name = (p.name || "").toLowerCase();
    const cat  = (p.category || "").toLowerCase();
    const tags = (p.tags || []).join(" ").toLowerCase();
    /* Every text field a product can carry, so no product is unfindable. */
    const rest = [
      p.slug || "",
      p.description || "",
      (p.details || []).join(" "),
      (p.colors || []).map(c => c.name || "").join(" "),
      (p.sizes || []).join(" "),
      p.price != null ? String(p.price) : ""
    ].join(" ").toLowerCase();
    const hay = name + " " + cat + " " + tags + " " + rest;

    let score = -1;
    if (name.startsWith(raw)) score = 0;
    else if (name.includes(raw)) score = 1;
    else if (cat.includes(raw) || tags.includes(raw)) score = 2;
    else if (rest.includes(raw)) score = 3;
    /* Multi-word: every word must appear somewhere on the product. */
    else if (words.length > 1 && words.every(w => hay.includes(w))) score = 4;
    /* Last resort: forgive a trailing plural / typo character. */
    else if (raw.length > 3 && hay.includes(raw.slice(0, -1))) score = 5;
    if (score >= 0) scored.push({ p, score });
  });
  scored.sort((a, b) => a.score - b.score || (a.p.name || "").localeCompare(b.p.name || ""));
  return scored.slice(0, limit || 6).map(s => s.p);
};

  const items = ["FREE SHIPPING OVER ₹5,000","COMPLIMENTARY RETURNS","SECURE CHECKOUT","CRAFTED WITH CARE","CRAFTED IN INDIA","NEW ARRIVALS NOW LIVE"];
  const text = [...items, ...items].join("   ·   ");
  return (
    <div style={{ background:"#1A1008", padding:"13px 0", overflow:"hidden" }}>
      <div className="marquee-track" style={{ fontFamily:"Jost", fontSize:10, fontWeight:500, letterSpacing:"0.16em", color:"#B8A99A", whiteSpace:"nowrap" }}>
        {[text, text].map((t, i) => <span key={i} style={{ paddingRight:60 }}>{t}</span>)}
      </div>
    </div>
  );
}

/* ─── Collections ───────────────────────────────────────────────── */
function Collections() {
  const { navigate } = useApp();
  const cols = window.COLLECTIONS;
  return (
    <section className="section" style={{ background:"#FAF9F7" }}>
      <div className="container">
        <SectionHeader label="CURATED FOR YOU" title="Shop by Collection" subtitle="Three worlds, one wardrobe. Find your story." />
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:20 }}>
          {cols.map((c, i) => (
            <CollectionCard key={c.id} collection={c} delay={i * 100}
              onShop={() => navigate("listing", { listFilter: c.filter })} />
          ))}
        </div>
      </div>
    </section>
  );
}

function CollectionCard({ collection: c, onShop, delay }) {
  const [hov, setHov] = useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      onClick={onShop}
      style={{
        position:"relative", borderRadius:12, overflow:"hidden", cursor:"pointer",
        aspectRatio:"3/4",
        boxShadow: hov ? "0 16px 48px rgba(0,0,0,0.15)" : "0 4px 16px rgba(0,0,0,0.07)",
        transition:"box-shadow 0.35s, transform 0.35s",
        transform: hov ? "translateY(-4px)" : "none",
        animationDelay: `${delay}ms`,
      }}>
      {c.slotId
        ? <div style={{ position:"absolute", inset:0 }}>
            <image-slot id={c.slotId} shape="rect" fit="cover"
              placeholder={`Drop a ${c.title} photo`}></image-slot>
          </div>
        : <img src={c.image} alt={c.title} style={{
            width:"100%", height:"100%", objectFit:"cover",
            transition:"transform 0.7s ease",
            transform: hov ? "scale(1.06)" : "scale(1)",
          }} />}
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", background:"linear-gradient(to top, rgba(10,6,2,0.75) 0%, rgba(10,6,2,0.2) 45%, transparent 70%)" }} />
      <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"28px 24px", pointerEvents:"none",
        transform: hov ? "translateY(-4px)" : "translateY(0)", transition:"transform 0.35s" }}>
        <p style={{ fontFamily:"Jost", fontSize:10, letterSpacing:"0.16em", color:"#C5A468", marginBottom:6 }}>{c.subtitle.toUpperCase()}</p>
        <h3 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:26, fontWeight:500, color:"#FAF9F7", marginBottom:14, lineHeight:1.1 }}>{c.title}</h3>
        <span style={{
          fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em",
          color:"#FAF9F7", display:"inline-flex", alignItems:"center", gap:8,
          borderBottom: hov ? "1px solid #C5A468" : "1px solid transparent",
          paddingBottom:2, transition:"border-color 0.25s",
        }}>{c.cta} <IconArrowRight size={14}/></span>
      </div>
    </div>
  );
}

/* ─── Trending Now ──────────────────────────────────────────────── */
function TrendingSection() {
  const { navigate } = useApp();
  /* Prefer tagged products, but never show an empty section — fall back
     to the most recent products so the homepage populates itself as the
     catalogue grows, with no tagging required. */
  const tagged   = window.PRODUCTS.filter(p => p.tags.includes("new") || p.tags.includes("bestseller"));
  const trending = (tagged.length ? tagged : window.PRODUCTS).slice(0, 4);
  return (
    <section className="section" style={{ background:"#F7F3EE" }}>
      <div className="container">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:48, flexWrap:"wrap", gap:16 }}>
          <SectionHeader label="TRENDING NOW" title="The Season's Favourites" center={false} />
          <button onClick={() => navigate("listing",{listFilter:"all"})} style={{
            background:"none", border:"none", cursor:"pointer",
            fontFamily:"Jost", fontSize:12, fontWeight:500, letterSpacing:"0.12em",
            color:"#8C7B6E", textDecoration:"underline", textUnderlineOffset:4,
            whiteSpace:"nowrap",

        <div className="grid-4">
          {trending.map(p => <ProductCard key={p.id} product={p} />)}

      </div>
    </section>
  );
}

/* ─── Best Sellers ──────────────────────────────────────────────── */
function BestSellers() {
  const { navigate } = useApp();
  const tagged = window.PRODUCTS.filter(p => p.tags.includes("bestseller"));
  const bs     = tagged.length ? tagged : window.PRODUCTS;
  return (
    <section className="section" style={{ background:"#FAF9F7" }}>
      <div className="container">
        <SectionHeader label="MOST LOVED" title="Best Sellers" subtitle="The pieces our customers return to, season after season." />
        <div className="grid-4">
          {bs.slice(0,4).map(p => <ProductCard key={p.id} product={p} />)}
        </div>
        <div style={{ textAlign:"center", marginTop:40 }}>
          <PrimaryBtn outline onClick={() => navigate("listing",{listFilter:"all"})}>
            SHOP ALL DRESSES <IconArrowRight size={16}/>
          </PrimaryBtn>
        </div>
      </div>
    </section>
  );
}

/* ─── Testimonials ──────────────────────────────────────────────── */
function Testimonials() {
  const [active, setActive] = useState(0);
  const data = window.TESTIMONIALS;
  useEffect(() => {
    if (!data || data.length === 0) return;
    const t = setInterval(() => setActive(a => (a+1) % data.length), 5200);
    return () => clearInterval(t);
  }, []);
  /* No reviews yet — hide the section rather than show an empty one.
     Guard sits after hooks (rules of hooks). */
  if (!data || data.length === 0) return null;

  return (
    <section className="section" style={{ background:"#1A1008" }}>
      <div className="container" style={{ maxWidth:900 }}>
        <SectionHeader label="CUSTOMER STORIES" title={<span style={{color:"#FAF9F7"}}>What They Say</span>} />
        <div style={{ position:"relative", minHeight:260 }}>
          {data.map((t, i) => (
            <div key={t.id} style={{
              position: i===active ? "relative" : "absolute",
              top:0, left:0, right:0,
              opacity: i===active ? 1 : 0,
              transition:"opacity 0.6s ease",
              pointerEvents: i===active ? "auto" : "none",
              textAlign:"center",
            }}>
              <div style={{ fontSize:48, color:"#C5A468", fontFamily:"Georgia,serif", lineHeight:0.8, marginBottom:20 }}>"</div>
              <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(18px,2.2vw,26px)", fontWeight:300, color:"#F2EDE7", lineHeight:1.55, marginBottom:28, fontStyle:"italic" }}>
                {t.text}
              </p>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:14 }}>
                <div style={{ width:44, height:44, borderRadius:"50%", background:"#2D1B0E", display:"flex", alignItems:"center", justifyContent:"center",
                  fontFamily:"Cormorant Garamond, serif", fontSize:16, fontWeight:600, color:"#C5A468" }}>
                  {t.avatar}
                </div>
                <div style={{ textAlign:"left" }}>
                  <p style={{ fontFamily:"Jost", fontSize:13, fontWeight:500, color:"#FAF9F7", marginBottom:2 }}>{t.name}</p>
                  <p style={{ fontFamily:"Jost", fontSize:11, color:"#6B5744" }}>{t.location} · {t.product}</p>
                </div>
              </div>
            </div>
          ))}
        </div>
        <div style={{ display:"flex", justifyContent:"center", gap:10, marginTop:36 }}>
          {data.map((_, i) => (
            <button key={i} onClick={() => setActive(i)} style={{
              width: i===active ? 24 : 7, height:7,
              borderRadius: i===active ? 4 : "50%",
              background: i===active ? "#C5A468" : "rgba(255,255,255,0.2)",
              border:"none", cursor:"pointer", padding:0,
              transition:"all 0.35s",
            }} />
          ))}
        </div>
      </div>
    </section>
  );
}

/* ─── Instagram Gallery ─────────────────────────────────────────── */
function InstagramGallery() {
  const photos = window.INSTAGRAM_PHOTOS;
  return (
    <section style={{ background:"#FAF9F7", paddingBottom:80 }}>
      <div className="container">
        <div style={{ textAlign:"center" }}>
          <a href="https://www.instagram.com/kanka_clothing?stkn=bGN1bzI4eGcyZnZv" target="_blank" rel="noopener noreferrer" style={{ textDecoration:"none", display:"block" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:12, color:"#C5A468" }}>
              <IconInstagram size={34} />

            <h2 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:32, fontWeight:400, color:"#1A1008", marginBottom:6 }}>

          <p style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E" }}>Follow us for styling inspiration &amp; new arrivals</p>

}

function InstaPhoto({ src }) {
  const [hov, setHov] = useState(false);
  return (
    <div className="img-1-1" onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ position:"relative", cursor:"pointer", borderRadius:6, overflow:"hidden" }}>
      <img src={src} alt="Instagram" style={{
        width:"100%", height:"100%", objectFit:"cover",
        transition:"transform 0.55s ease",
        transform: hov ? "scale(1.08)" : "scale(1)",
      }} />
      <div style={{
        position:"absolute", inset:0,
        background:"rgba(26,16,8,0.45)",
        display:"flex", alignItems:"center", justifyContent:"center",
        opacity: hov ? 1 : 0, transition:"opacity 0.3s",
      }}>
        <IconInstagram size={24} />
      </div>
    </div>
  );
}

/* ─── Brand Values strip ────────────────────────────────────────── */
function ValuesStrip() {
  const vals = [
    { icon:"✦", title:"Premium Quality", desc:"Only the finest fabrics sourced globally" },
    { icon:"♻", title:"Sustainable",     desc:"Crafted with the planet in mind" },
    { icon:"↩", title:"Free Returns",    desc:"30-day no-hassle return policy" },

            <div style={{ fontSize:20, marginBottom:10 }}>{v.icon}</div>
            <p style={{ fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.08em", color:"#1A1008", marginBottom:4 }}>{v.title}</p>
            <p style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E", lineHeight:1.5 }}>{v.desc}</p>
          </div>

}

/* ─── HomePage ──────────────────────────────────────────────────── */
function HomePage() {
  return (
    <div className="page-enter">
      <Navbar overlay={true} />
      <Hero />
      <Collections />
      <TrendingSection />
      <Testimonials />
      <BestSellers />
      <InstagramGallery />
      <Footer />
    </div>
  );
}

Object.assign(window, { HomePage });

})();

// listing.jsx — Product listing page with filters, sort, grid
const { useState, useEffect, useMemo } = React;
const { Navbar, Footer, ProductCard, SectionHeader, PrimaryBtn, useApp, IconX } = window;

/* ─── Filter Sidebar ─────────────────────────────────────────────── */
function FilterSidebar({ filters, setFilters, onClose, isMobile }) {
  const categories = window.CATEGORIES;
  const allColors  = [...new Set(window.PRODUCTS.flatMap(p => p.colors.map(c => c.name)))];
  const allSizes   = ["XS","S","M","L","XL","XXL"];

  function toggle(key, val) {
    setFilters(f => {
      const arr = f[key] || [];
      return { ...f, [key]: arr.includes(val) ? arr.filter(x => x!==val) : [...arr, val] };
    });
  }

  const labelStyle = { fontFamily:"Jost", fontSize:10, fontWeight:600, letterSpacing:"0.16em", color:"#1A1008", marginBottom:14, display:"block" };
  const sectionStyle = { marginBottom:28, paddingBottom:28, borderBottom:"1px solid #EDE8E0" };

  return (
    <div style={{ width: isMobile ? "100%" : 220, flexShrink:0 }}>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:28 }}>
        <span style={{ fontFamily:"Cormorant Garamond, serif", fontSize:20, fontWeight:500, color:"#1A1008" }}>Filter</span>
        <div style={{ display:"flex", gap:12, alignItems:"center" }}>
          {Object.values(filters).some(v => Array.isArray(v) ? v.length>0 : false) && (
            <button onClick={() => setFilters({ categories:[], colors:[], sizes:[], priceMax:12000 })}
              style={{ background:"none", border:"none", cursor:"pointer", fontFamily:"Jost", fontSize:11, color:"#C5A468", letterSpacing:"0.08em" }}>
              CLEAR ALL
            </button>
          )}
          {isMobile && <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", lineHeight:0 }}><IconX size={20}/></button>}
        </div>
      </div>

      {/* Category */}
      <div style={sectionStyle}>
        <span style={labelStyle}>CATEGORY</span>
        {categories.map(c => (
          <button key={c.id} onClick={() => toggle("categories", c.id)}
            style={{
              display:"flex", justifyContent:"space-between", alignItems:"center",
              width:"100%", background:"none", border:"none", cursor:"pointer",
              fontFamily:"Jost", fontSize:13,
              color: filters.categories.includes(c.id) ? "#1A1008" : "#8C7B6E",
              fontWeight: filters.categories.includes(c.id) ? 600 : 400,
              padding:"6px 0", transition:"color 0.2s",
            }}>
            <span>{c.label}</span>
            <span style={{ fontSize:11, color:"#B8A99A" }}>{c.count}</span>
          </button>
        ))}
      </div>

      {/* Price */}
      <div style={sectionStyle}>
        <span style={labelStyle}>PRICE</span>
        <div style={{ marginBottom:10, display:"flex", justifyContent:"space-between" }}>
          <span style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E" }}>₹0</span>
          <span style={{ fontFamily:"Jost", fontSize:12, color:"#1A1008", fontWeight:500 }}>up to ₹{filters.priceMax.toLocaleString("en-IN")}</span>
        </div>
        <input type="range" min={2000} max={12000} step={500}
          value={filters.priceMax}
          onChange={e => setFilters(f => ({ ...f, priceMax: +e.target.value }))}
          style={{ width:"100%" }}
        />
      </div>

      {/* Sizes */}
      <div style={sectionStyle}>
        <span style={labelStyle}>SIZE</span>
        <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
          {allSizes.map(sz => {
            const active = filters.sizes.includes(sz);
            return (
              <button key={sz} onClick={() => toggle("sizes", sz)} style={{
                width:42, height:34, border:`1.5px solid ${active?"#1A1008":"#E8E0D5"}`,
                background: active ? "#1A1008" : "transparent",
                color: active ? "#FAF9F7" : "#6B5744",
                fontFamily:"Jost", fontSize:11, fontWeight:500, cursor:"pointer",
                borderRadius:4, transition:"all 0.2s",
              }}>{sz}</button>
            );
          })}
        </div>
      </div>

      {/* Tags */}
      <div style={sectionStyle}>
        <span style={labelStyle}>AVAILABILITY</span>
        {["new","sale","bestseller"].map(tag => {
          const active = filters.tags && filters.tags.includes(tag);
          return (
            <button key={tag} onClick={() => toggle("tags", tag)}
              style={{
                display:"flex", alignItems:"center", gap:10,
                width:"100%", background:"none", border:"none", cursor:"pointer",
                fontFamily:"Jost", fontSize:13, color: active ? "#1A1008" : "#8C7B6E",
                fontWeight: active ? 600 : 400, padding:"6px 0",
              }}>
              <div style={{
                width:16, height:16, borderRadius:3,
                border:`1.5px solid ${active?"#1A1008":"#C4B8A8"}`,
                background: active ? "#1A1008" : "transparent",
                display:"flex", alignItems:"center", justifyContent:"center",
                flexShrink:0, transition:"all 0.2s",

                {active && <svg width={9} height={9} viewBox="0 0 10 10" fill="none"><polyline points="1.5,5 4,8 9,2" stroke="#FAF9F7" strokeWidth="1.8" strokeLinecap="round"/></svg>}
              </div>
              {tag === "new" ? "New Arrivals" : tag === "sale" ? "On Sale" : "Best Sellers"}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Sort Bar ──────────────────────────────────────────────────── */
function SortBar({ sort, setSort, count, onOpenFilter }) {
  const opts = [
    { val:"featured",    label:"Featured"        },
    { val:"price-asc",  label:"Price: Low–High"  },
    { val:"price-desc", label:"Price: High–Low"  },
    { val:"rating",     label:"Top Rated"        },
    { val:"newest",     label:"Newest"           },
  ];
  return (
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:28, flexWrap:"wrap", gap:12 }}>
      <p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>
        <strong style={{ color:"#1A1008", fontWeight:600 }}>{count}</strong> pieces
      </p>
      <div style={{ display:"flex", gap:12, alignItems:"center" }}>
        <button className="hide-desktop" onClick={onOpenFilter}
          style={{
            background:"none",
            border:"1.5px solid #E8E0D5", fontFamily:"Jost", fontSize:12,
            fontWeight:500, letterSpacing:"0.1em", padding:"10px 18px",
            borderRadius:6, cursor:"pointer", color:"#1A1008",
          }}>
          ⊟ FILTER
        </button>
        <select value={sort} onChange={e => setSort(e.target.value)}
          style={{
            fontFamily:"Jost", fontSize:12, color:"#1A1008",
            border:"1.5px solid #E8E0D5", background:"#FAF9F7",
            padding:"8px 14px", borderRadius:6, cursor:"pointer", outline:"none",
          }}>
          {opts.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
        </select>
      </div>
    </div>
  );
}

/* ─── ListingPage ───────────────────────────────────────────────── */
function ListingPage() {
  const { route } = useApp();
  const initFilter = route.listFilter || "all";
  const initSearch = route.searchQuery || "";

  const [filters, setFilters] = useState({
    categories: initFilter !== "all" && initFilter !== "collection" && initFilter !== "sale" && initFilter !== "new"
      ? [initFilter] : [],
    sizes: [],
    tags: initFilter === "sale" ? ["sale"] : initFilter === "new" ? ["new"] : [],
    priceMax: 12000,
  });
  const [sort,       setSort]       = useState("featured");
  const [mobileFilters, setMobileFilters] = useState(false);
  const [search,     setSearch]     = useState(initSearch);

  const heading = initFilter === "sale" ? "Sale" : initFilter === "new" ? "New Arrivals" : "All Dresses";

  const filtered = useMemo(() => {
    let p = [...window.PRODUCTS];
    if (search) p = p.filter(x => (x.name || "").toLowerCase().includes(search.toLowerCase()));
    if (filters.categories.length) p = p.filter(x => filters.categories.includes(x.category));
    if (filters.tags && filters.tags.length) p = p.filter(x => filters.tags.some(t => x.tags.includes(t)));
    p = p.filter(x => x.price <= filters.priceMax);
    if (sort === "price-asc")  p.sort((a,b) => a.price - b.price);
    if (sort === "price-desc") p.sort((a,b) => b.price - a.price);
    if (sort === "rating")     p.sort((a,b) => b.rating - a.rating);
    if (sort === "newest")     p.sort((a,b) => b.id - a.id);
    return p;
  }, [filters, sort, search]);

  return (
    <div className="page-enter">
      <Navbar />
      {/* Page header */}
      <div style={{ background:"#F7F3EE", borderBottom:"1px solid #EDE8E0" }}>
        <div className="container section-sm">
          <p style={{ fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.18em", color:"#C5A468", marginBottom:8 }}>KANKA</p>
          <h1 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(36px,5vw,60px)", fontWeight:500, color:"#1A1008", lineHeight:1.05 }}>{heading}</h1>
        </div>
      </div>

      <div className="container listing-container">
        {/* Search bar */}
        {search && (
          <div style={{ marginBottom:20, display:"flex", alignItems:"center", gap:10 }}>
            <p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>
              Showing results for: <strong style={{ color:"#1A1008" }}>"{search}"</strong>
            </p>
            <button onClick={() => setSearch("")} style={{ background:"none", border:"none", cursor:"pointer", lineHeight:0, color:"#B8A99A" }}>
              <IconX size={14}/>
            </button>
          </div>
        )}

        <div style={{ display:"flex", gap:48, alignItems:"flex-start" }}>
          {/* Sidebar — desktop */}
          <div className="hide-mobile">
            <FilterSidebar filters={filters} setFilters={setFilters} />
          </div>

          {/* Product grid */}
          <div style={{ flex:1, minWidth:0 }}>
            <SortBar sort={sort} setSort={setSort} count={filtered.length} onOpenFilter={() => setMobileFilters(true)} />
            {filtered.length === 0 ? (
              <div style={{ textAlign:"center", padding:"80px 0" }}>
                <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:28, color:"#B8A99A", marginBottom:16 }}>No pieces found</p>
                <PrimaryBtn onClick={() => setFilters({ categories:[], sizes:[], tags:[], priceMax:12000 })} outline>Clear Filters</PrimaryBtn>
              </div>
            ) : (
              <div className="grid-3" style={{ display:"grid", gap:20 }}>
                {filtered.map(p => <ProductCard key={p.id} product={p} />)}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Mobile filter drawer */}
      {mobileFilters && (
        <div style={{ position:"fixed", inset:0, zIndex:1000, display:"flex" }}>
          <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.4)" }} onClick={() => setMobileFilters(false)} />
          <div style={{
            position:"relative", zIndex:1, marginLeft:"auto",
            width:"min(320px,90vw)", background:"#FAF9F7",
            padding:"28px", overflowY:"auto",
            animation:"slideDown 0.25s ease",
          }}>
            <FilterSidebar filters={filters} setFilters={setFilters} onClose={() => setMobileFilters(false)} isMobile />
            <PrimaryBtn full onClick={() => setMobileFilters(false)}>VIEW {filtered.length} RESULTS</PrimaryBtn>
          </div>
        </div>
      )}

      <Footer />
    </div>
  );
}

Object.assign(window, { ListingPage });

})();
  </script>

// Customer-priority improvements:
// 1. Swipeable touch gallery with dot indicators
// 2. Sticky "Add to Bag" bottom bar on mobile
// 3. Bigger size buttons (easier to tap)
// 4. Lazy loading images
// 5. Smooth page-transition animation

const { useState, useEffect, useRef, useCallback } = React;
const { Navbar, Footer, ProductCard, StarRating, SectionHeader, PrimaryBtn,
        useApp, useCart, IconChevronLeft, IconChevronRight, IconHeart, IconCheck, IconArrowRight } = window;

/* ─── Swipeable Image Gallery ───────────────────────────────────── */
function ImageGallery({ images }) {
  const [active,  setActive]  = useState(0);
  const [zoom,    setZoom]    = useState(false);
  const trackRef              = useRef(null);
  const startX                = useRef(null);
  const isDragging            = useRef(false);

  /* Touch swipe handlers */
  function onTouchStart(e) {
    startX.current  = e.touches[0].clientX;
    isDragging.current = false;
  }
  function onTouchMove(e) {
    if (startX.current === null) return;
    const dx = Math.abs(e.touches[0].clientX - startX.current);
    if (dx > 8) isDragging.current = true;
  }
  function onTouchEnd(e) {
    if (startX.current === null) return;
    const dx = e.changedTouches[0].clientX - startX.current;
    if (Math.abs(dx) > 44) {
      if (dx < 0) setActive(a => Math.min(a + 1, images.length - 1));
      else        setActive(a => Math.max(a - 1, 0));
    }
    startX.current = null;
  }

  return (
    <div className="detail-gallery" style={{ flex:"0 0 auto", width:"min(520px,100%)" }}>

      {/* Main image — swipeable on touch */}
      <div
        ref={trackRef}
        className="img-3-4"
        style={{ borderRadius:14, overflow:"hidden", position:"relative", background:"#F2EDE7",
          cursor: images.length > 1 ? "grab" : "zoom-in", userSelect:"none" }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onClick={() => { if (!isDragging.current) setZoom(true); }}
      >
        <img
          src={images[active]}
          alt=""
          loading="lazy"
          style={{
            width:"100%", height:"100%", objectFit:"cover",
            transition:"opacity 0.3s ease",
            pointerEvents:"none", userSelect:"none",
          }}
        />

        {/* Arrow buttons — desktop only */}
        {images.length > 1 && (
          <>
            <button
              className="hide-mobile"
              onClick={e => { e.stopPropagation(); setActive(a => (a - 1 + images.length) % images.length); }}
              style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)",
                background:"rgba(250,249,247,0.88)", border:"none", borderRadius:"50%",
                width:38, height:38, display:"flex", alignItems:"center", justifyContent:"center",
                cursor:"pointer", backdropFilter:"blur(6px)", boxShadow:"0 2px 8px rgba(0,0,0,0.1)" }}>
              <IconChevronLeft />
            </button>
            <button
              className="hide-mobile"
              onClick={e => { e.stopPropagation(); setActive(a => (a + 1) % images.length); }}
              style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)",
                background:"rgba(250,249,247,0.88)", border:"none", borderRadius:"50%",
                width:38, height:38, display:"flex", alignItems:"center", justifyContent:"center",
                cursor:"pointer", backdropFilter:"blur(6px)", boxShadow:"0 2px 8px rgba(0,0,0,0.1)" }}>
              <IconChevronRight />
            </button>
          </>
        )}

        {/* Dot indicators — mobile only */}
        {images.length > 1 && (
          <div style={{
            position:"absolute", bottom:14, left:0, right:0,
            display:"flex", justifyContent:"center", gap:6,
          }}>
            {images.map((_, i) => (
              <button
                key={i}
                onClick={e => { e.stopPropagation(); setActive(i); }}
                style={{
                  width: i === active ? 20 : 6,
                  height:6, borderRadius:3,
                  background: i === active ? "#FAF9F7" : "rgba(250,249,247,0.5)",
                  border:"none", padding:0, cursor:"pointer",
                  transition:"all 0.3s ease",
                }}
              />
            ))}
          </div>
        )}

        {/* Zoom hint on desktop */}
        <div className="hide-mobile" style={{
          position:"absolute", top:12, right:12,
          background:"rgba(250,249,247,0.85)", borderRadius:6,
          fontFamily:"Jost", fontSize:10, fontWeight:500, color:"#6B5744",
          padding:"4px 10px", letterSpacing:"0.05em", backdropFilter:"blur(4px)",
        }}>CLICK TO ZOOM</div>
      </div>

      {/* Thumbnails — desktop only */}
      {images.length > 1 && (
        <div className="hide-mobile" style={{ display:"flex", gap:10, marginTop:12 }}>
          {images.map((img, i) => (
            <button key={i} onClick={() => setActive(i)} style={{
              flex:1, aspectRatio:"3/4", overflow:"hidden", borderRadius:8, padding:0, border:"none",
              outline: i === active ? "2px solid #1A1008" : "2px solid transparent",
              outlineOffset:2, cursor:"pointer", transition:"outline-color 0.2s",
            }}>
              <img src={img} alt="" loading="lazy" style={{ width:"100%", height:"100%", objectFit:"cover" }} />
            </button>
          ))}
        </div>
      )}

      {/* Zoom lightbox */}
      {zoom && (
        <div
          style={{ position:"fixed", inset:0, zIndex:2000, background:"rgba(0,0,0,0.94)",
            display:"flex", alignItems:"center", justifyContent:"center", cursor:"zoom-out",
            animation:"fadeIn 0.2s ease" }}
          onClick={() => setZoom(false)}
        >
          <img src={images[active]} alt="" style={{ maxWidth:"92vw", maxHeight:"92vh", objectFit:"contain" }} />
          <button onClick={() => setZoom(false)} style={{
            position:"absolute", top:16, right:16,
            background:"rgba(250,249,247,0.15)", border:"none", borderRadius:"50%",
            width:40, height:40, color:"#FAF9F7", fontSize:22, cursor:"pointer",
            display:"flex", alignItems:"center", justifyContent:"center",
          }}>×</button>
        </div>
      )}
    </div>
  );
}

/* ─── Accordion ─────────────────────────────────────────────────── */
function Accordion({ title, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderBottom:"1px solid #EDE8E0" }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width:"100%", background:"none", border:"none", cursor:"pointer",
        display:"flex", justifyContent:"space-between", alignItems:"center",
        padding:"18px 0", fontFamily:"Jost", fontSize:12, fontWeight:600,
        letterSpacing:"0.1em", color:"#1A1008", minHeight:44,
      }}>
        {title}
        <span style={{ fontSize:18, fontWeight:300, transform: open ? "rotate(45deg)" : "rotate(0)", transition:"transform 0.25s" }}>+</span>
      </button>
      {open && (
        <div style={{ paddingBottom:18, animation:"fadeIn 0.2s ease" }}>
          {children}
        </div>
      )}
    </div>
  );
}

/* ─── Product Info ──────────────────────────────────────────────── */
function ProductInfo({ product, onAddedChange }) {
  const { addToCart } = useCart();
  const { navigate }  = useApp();

  const [selColor, setSelColor] = useState(product.colors[0].name);
  const [selSize,  setSelSize]  = useState(null);
  const [qty,      setQty]      = useState(1);
  const [wished,   setWished]   = useState(false);
  const [added,    setAdded]    = useState(false);
  const [sizeErr,  setSizeErr]  = useState(false);

  function handleAdd() {
    if (!selSize) { setSizeErr(true); return; }
    setSizeErr(false);
    addToCart({ id:product.id, name:product.name, price:product.price,
      image:product.images[0], color:selColor, size:selSize, quantity:qty });
    setAdded(true);
    onAddedChange?.(true);
    setTimeout(() => { setAdded(false); onAddedChange?.(false); }, 2500);
  }

  function handleBuyNow() {
    if (!selSize) { setSizeErr(true); return; }
    addToCart({ id:product.id, name:product.name, price:product.price,
      image:product.images[0], color:selColor, size:selSize, quantity:qty });
    navigate("checkout");
  }

  const savings = product.originalPrice ? product.originalPrice - product.price : 0;

  return (
    <div style={{ flex:1, minWidth:0 }}>
      {/* Breadcrumb */}
      <p style={{ fontFamily:"Jost", fontSize:11, color:"#B8A99A", letterSpacing:"0.08em", marginBottom:14 }}>
        Products / {product.category.charAt(0).toUpperCase()+product.category.slice(1)} / {product.name}
      </p>

      {/* Name */}
      <h1 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(26px,3.5vw,44px)", fontWeight:500, color:"#1A1008", lineHeight:1.1, marginBottom:10 }}>
        {product.name}
      </h1>

      {/* Rating */}
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
        <StarRating rating={product.rating} size={14} />
        <span style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E" }}>
          {product.rating} ({product.reviewCount} reviews)
        </span>
      </div>

      {/* Price */}
      <div style={{ display:"flex", alignItems:"baseline", gap:12, marginBottom:20 }}>
        <span style={{ fontFamily:"Cormorant Garamond, serif", fontSize:30, fontWeight:500, color:"#1A1008" }}>₹{product.price.toLocaleString("en-IN")}</span>
        {product.originalPrice && savings > 0 && (
          <>
            <span style={{ fontFamily:"Jost", fontSize:15, color:"#B8A99A", textDecoration:"line-through" }}>₹{product.originalPrice.toLocaleString("en-IN")}</span>
            <span style={{ fontFamily:"Jost", fontSize:11, fontWeight:600, color:"#C5A468", background:"#FDF5E8", padding:"3px 10px", borderRadius:4 }}>
              SAVE ₹{savings.toLocaleString("en-IN")}
            </span>
          </>
        )}
      </div>

      <p style={{ fontFamily:"Jost", fontSize:14, lineHeight:1.8, color:"#5C4033", marginBottom:24, borderTop:"1px solid #EDE8E0", paddingTop:18 }}>
        {product.description}
      </p>

      {/* Color selector */}
      <div style={{ marginBottom:22 }}>
        <p style={{ fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.12em", color:"#1A1008", marginBottom:12 }}>
          COLOR — <span style={{ fontWeight:400, color:"#6B5744" }}>{selColor}</span>
        </p>
        <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
          {product.colors.map(c => (
            <button key={c.name} title={c.name} onClick={() => setSelColor(c.name)} style={{
              width:34, height:34, borderRadius:"50%",
              background:c.hex,
              border:`2px solid ${selColor===c.name ? "#1A1008" : "transparent"}`,
              outline: selColor===c.name ? "2px solid #1A1008" : "2px solid #E8E0D5",
              outlineOffset:3, cursor:"pointer", transition:"all 0.2s",
            }} />
          ))}
        </div>
      </div>

      {/* Size selector — bigger tap targets */}
      <div style={{ marginBottom:24 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <p style={{
            fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.12em",
            color: sizeErr ? "#C0392B" : "#1A1008",
          }}>
            SIZE {sizeErr && <span style={{ fontWeight:400 }}> — Please select a size</span>}
          </p>
          <button style={{ background:"none", border:"none", cursor:"pointer",
            fontFamily:"Jost", fontSize:11, color:"#C5A468", letterSpacing:"0.08em",
            textDecoration:"underline", textUnderlineOffset:3, padding:"4px 0" }}>
            SIZE GUIDE
          </button>
        </div>
        <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
          {product.sizes.map(sz => (
            <button key={sz} onClick={() => { setSelSize(sz); setSizeErr(false); }} style={{
              minWidth:62, height:52,   /* bigger tap target */
              padding:"0 14px",
              border:`1.5px solid ${selSize===sz ? "#1A1008" : sizeErr ? "#E8C4B8" : "#E8E0D5"}`,
              background: selSize===sz ? "#1A1008" : "transparent",
              color: selSize===sz ? "#FAF9F7" : "#6B5744",
              fontFamily:"Jost", fontSize:13, fontWeight:500, cursor:"pointer",
              borderRadius:8, transition:"all 0.2s",
            }}>{sz}</button>
          ))}
        </div>
      </div>

      {/* Quantity + Add to bag — shown on every size. The buttons belong
          directly under the size picker; a shopper who has just chosen a
          size should not have to hunt for how to buy. */}
      <div style={{ display:"flex", gap:12, marginBottom:14, flexWrap:"wrap" }}>
        <div style={{ display:"flex", alignItems:"center", border:"1.5px solid #E8E0D5", borderRadius:8, overflow:"hidden" }}>
          <button onClick={() => setQty(q => Math.max(1,q-1))} style={{
            width:44, height:52, background:"none", border:"none",
            cursor:"pointer", fontSize:20, color:"#6B5744", fontFamily:"Jost",
          }}>−</button>
          <span style={{ width:40, textAlign:"center", fontFamily:"Jost", fontSize:14, fontWeight:500 }}>{qty}</span>
          <button onClick={() => setQty(q => Math.min(10,q+1))} style={{
            width:44, height:52, background:"none", border:"none",
            cursor:"pointer", fontSize:20, color:"#6B5744", fontFamily:"Jost",
          }}>+</button>
        </div>

        <button onClick={handleAdd} style={{
          flex:1, minWidth:180, height:52,
          background: added ? "#2D5A1B" : "#1A1008",
          color:"#FAF9F7", border:"none",
          fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.14em",
          borderRadius:8, cursor:"pointer", transition:"background 0.25s",
          display:"flex", alignItems:"center", justifyContent:"center", gap:8,
        }}>
          {added ? <><IconCheck size={15}/> ADDED TO BAG</> : "ADD TO BAG"}
        </button>

        <button onClick={() => setWished(w => !w)} style={{
          width:52, height:52, border:`1.5px solid ${wished?"#C5A468":"#E8E0D5"}`,
          background: wished ? "#FDF5E8" : "transparent",
          borderRadius:8, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
          transition:"all 0.2s",
        }}>
          <IconHeart size={18} filled={wished} />
        </button>
      </div>

      {/* Buy now */}
      <button onClick={handleBuyNow} style={{
        width:"100%", height:50,
        background:"transparent", border:"1.5px solid #1A1008",
        color:"#1A1008", fontFamily:"Jost", fontSize:12, fontWeight:600,
        letterSpacing:"0.14em", borderRadius:8, cursor:"pointer",
        marginBottom:24, transition:"all 0.2s",
      }}>BUY NOW</button>

      {/* Trust badges */}
      <div style={{ display:"flex", gap:20, marginBottom:28, flexWrap:"wrap" }}>
        {[["↩","Free 30-day returns"],["🔒","Secure checkout"],["✈","Free shipping"]].map(([icon,label],i) => (
          <div key={i} style={{ display:"flex", alignItems:"center", gap:6 }}>
            <span style={{ fontSize:14 }}>{icon}</span>
            <span style={{ fontFamily:"Jost", fontSize:11, color:"#8C7B6E" }}>{label}</span>
          </div>
        ))}
      </div>

      {/* Accordions */}
      <Accordion title="PRODUCT DETAILS">
        <ul style={{ paddingLeft:0, listStyle:"none" }}>
          {product.details.map((d,i) => (
            <li key={i} style={{ fontFamily:"Jost", fontSize:13, color:"#6B5744", padding:"5px 0", display:"flex", gap:10 }}>
              <span style={{ color:"#C5A468", flexShrink:0 }}>·</span>{d}
            </li>
          ))}
        </ul>
      </Accordion>
      <Accordion title="SHIPPING & RETURNS">
        <p style={{ fontFamily:"Jost", fontSize:13, color:"#6B5744", lineHeight:1.75 }}>
          Standard shipping (3–5 days) is complimentary on orders over ₹5,000. Express shipping (1–2 days) available at checkout.
          Returns are accepted within 30 days of delivery. Items must be unworn with tags attached.
        </p>
      </Accordion>
      <Accordion title="CARE GUIDE">
        <p style={{ fontFamily:"Jost", fontSize:13, color:"#6B5744", lineHeight:1.75 }}>
          To preserve the beauty of your piece, follow the care instructions on the label. Most of our garments benefit from gentle hand washing or dry cleaning. Store in a cool, dry place away from direct sunlight.
        </p>
      </Accordion>

      {/* The sticky mobile bar used to live here. It's gone: the real
          Add to Bag / Buy Now buttons now show on mobile directly under
          the size picker, and two sets of buy buttons is worse than one
          in the right place. */}
    </div>
  );
}

/* ─── Sticky Mobile Add-to-Bag Bar ──────────────────────────────── */
function StickyMobileBar({ product, selSize, selColor, qty, setQty, added, sizeErr, wished, setWished, onAdd, onBuyNow, setSizeErr, setSelSize }) {
  const barRef = useRef(null);

  /* Once the footer appears, slide the bar out of the way. Leaving it
     pinned over the footer makes the price look like it belongs to the
     footer rather than the product. */
  useEffect(() => {
    const footer = document.querySelector("footer");
    const bar    = barRef.current;
    if (!footer || !bar || !("IntersectionObserver" in window)) return;

    const io = new IntersectionObserver(
      ([entry]) => bar.classList.toggle("bar-hidden", entry.isIntersecting),
      { rootMargin: "0px 0px -40px 0px" }
    );
    io.observe(footer);
    return () => io.disconnect();
  }, []);

  return (
    <div ref={barRef} style={{
      position:"fixed", bottom:64, left:0, right:0,
      background:"#FAF9F7",
      borderTop:"1px solid #EDE8E0",
      padding:"12px 16px",
      zIndex:90,
      display:"none",  /* shown via CSS on mobile */
      gap:10,
      boxShadow:"0 -4px 16px rgba(0,0,0,0.06)",
    }} className="mobile-sticky-bar">

      {/* Price */}
      <div style={{ display:"flex", flexDirection:"column", justifyContent:"center", minWidth:60 }}>
        <span style={{ fontFamily:"Cormorant Garamond, serif", fontSize:20, fontWeight:500, color:"#1A1008", lineHeight:1 }}>
          ₹{product.price.toLocaleString("en-IN")}
        </span>
        {product.originalPrice && product.originalPrice > product.price && (
          <span style={{ fontFamily:"Jost", fontSize:11, color:"#B8A99A", textDecoration:"line-through" }}>
            ₹{product.originalPrice.toLocaleString("en-IN")}
          </span>
        )}
      </div>

      {/* Qty control */}
      <div style={{ display:"flex", alignItems:"center", border:"1.5px solid #E8E0D5", borderRadius:8, overflow:"hidden", flexShrink:0 }}>
        <button onClick={() => setQty(q => Math.max(1,q-1))} style={{
          width:38, height:48, background:"none", border:"none", cursor:"pointer", fontSize:18, color:"#6B5744",
        }}>−</button>
        <span style={{ width:32, textAlign:"center", fontFamily:"Jost", fontSize:13, fontWeight:500 }}>{qty}</span>
        <button onClick={() => setQty(q => Math.min(10,q+1))} style={{
          width:38, height:48, background:"none", border:"none", cursor:"pointer", fontSize:18, color:"#6B5744",
        }}>+</button>
      </div>

      {/* Add to bag */}
      <button onClick={onAdd} style={{
        flex:1, height:48,
        background: added ? "#2D5A1B" : sizeErr ? "#C0392B" : "#1A1008",
        color:"#FAF9F7", border:"none",
        fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.12em",
        borderRadius:8, cursor:"pointer", transition:"background 0.25s",
        display:"flex", alignItems:"center", justifyContent:"center", gap:6,
      }}>
        {added ? <><IconCheck size={13}/> ADDED</> : sizeErr ? "SELECT SIZE" : "ADD TO BAG"}
      </button>

      {/* Buy now */}
      <button onClick={onBuyNow} style={{
        height:48, padding:"0 14px",
        background:"transparent", border:"1.5px solid #1A1008",
        color:"#1A1008", fontFamily:"Jost", fontSize:11, fontWeight:600,
        letterSpacing:"0.1em", borderRadius:8, cursor:"pointer", flexShrink:0,
      }}>BUY</button>
    </div>
  );
}

/* ─── Related Products ──────────────────────────────────────────── */
function RelatedProducts({ currentId }) {
  const related = window.PRODUCTS.filter(p => p.id !== currentId).slice(0, 4);
  return (
    <section className="section" style={{ background:"#F7F3EE" }}>
      <div className="container">
        <SectionHeader label="YOU MAY ALSO LIKE" title="Complete the Look" center={false} />
        <div className="grid-4">
          {related.map(p => <ProductCard key={p.id} product={p} />)}
        </div>
      </div>
    </section>
  );
}

/* ─── DetailPage ────────────────────────────────────────────────── */
function DetailPage() {
  const { route } = useApp();
  const product = window.PRODUCTS.find(p => p.id === route.productId) || window.PRODUCTS[0];

  useEffect(() => { window.scrollTo(0,0); }, [route.productId]);

  return (
    <div className="page-enter">
      <Navbar />
      <div>
        <div className="container detail-container detail-mobile-padding">
          <div style={{ display:"flex", gap:48, flexWrap:"wrap", alignItems:"flex-start" }}>
            <ImageGallery images={product.images} />
            <ProductInfo product={product} />
          </div>
        </div>
        <RelatedProducts currentId={product.id} />
      </div>
      <Footer />
    </div>
  );
}

Object.assign(window, { DetailPage });

})();

function PromoCode() {
  const { cartTotal } = useCart();
  const [code,    setCode]    = useState("");
  const [applied, setApplied] = useState(() => {
    try { return JSON.parse(localStorage.getItem("kanka_discount") || "null"); } catch { return null; }
  });
  const [err,     setErr]     = useState("");
  const [busy,    setBusy]    = useState(false);

  /* Checked against the discount_codes table — and checked again,
     independently, when the order is priced on the server. */
  async function apply() {
    if (busy || !code.trim()) return;
    setBusy(true); setErr("");
    try {
      const res = await fetch("/api/validate-discount", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ code, subtotal: cartTotal }),
      });
      const data = await res.json();
      if (!res.ok || !data.valid) {
        setErr(data.error || "That code isn't valid.");
      } else {
        const saved = { code: data.code, discount: data.discount, label: data.label };
        localStorage.setItem("kanka_discount", JSON.stringify(saved));
        setApplied(saved);
        setCode("");
      }
    } catch {
      setErr("Couldn't check that code right now. Please try again.");
    } finally {
      setBusy(false);
    }
  }

  function remove() {
    localStorage.removeItem("kanka_discount");
    setApplied(null);
  }

  return (
    <div style={{ marginBottom:20 }}>
      {applied ? (
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
          fontFamily:"Jost", fontSize:12, color:"#2D5A1B", background:"#EEF7EC", padding:"8px 12px", borderRadius:6 }}>
          <span>✓ {applied.code} applied — {applied.label}</span>
          <button onClick={remove} style={{ background:"none", border:"none", cursor:"pointer",
            fontFamily:"Jost", fontSize:11, color:"#6B5744", textDecoration:"underline", textUnderlineOffset:2 }}>remove</button>
        </div>
      ) : (
        <div style={{ display:"flex", gap:0 }}>
          <input value={code} onChange={e=>setCode(e.target.value)}
            onKeyDown={e => e.key === "Enter" && apply()}
            placeholder="Promo code" disabled={busy}
            style={{
              flex:1, fontFamily:"Jost", fontSize:12, padding:"10px 14px",
              border:`1.5px solid ${err?"#E8C4B8":"#E8E0D5"}`, borderRight:"none",
              background:"#fff", outline:"none", borderRadius:"6px 0 0 6px",
              color:"#1A1008", textTransform:"uppercase",
            }}
          />
          <button onClick={apply} disabled={busy} style={{
            background:"#1A1008", color:"#FAF9F7", border:"none",
            fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.1em",
            padding:"10px 14px", cursor: busy?"wait":"pointer", borderRadius:"0 6px 6px 0",
            opacity: busy?0.7:1,
          }}>{busy ? "…" : "APPLY"}</button>
        </div>
      )}
      {err && <p style={{ fontFamily:"Jost", fontSize:11, color:"#C0392B", marginTop:6 }}>{err}</p>}
    </div>
  );
}

              <div style={{ flex:1, minWidth:300 }}>
                <div style={{ display:"flex", justifyContent:"space-between", borderBottom:"2px solid #1A1008", paddingBottom:12, marginBottom:4 }}>
                  <span style={{ fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em", color:"#1A1008" }}>PRODUCT</span>

      <Footer />
    </div>
  );
}

/* ─── Razorpay helpers ──────────────────────────────────────────── */

/* Cart lines are stripped down to identity only. No prices leave the
   browser — the server looks up every rupee itself. */
function buildServerItems(cart) {
  return cart.map(item => {
    const product = (window.PRODUCTS || []).find(p => p.uuid === item.uuid || p.id === item.id);
    if (!product?.uuid) return null;
    return {
      product_id: product.uuid,
      color:      item.color,
      size:       item.size,
      quantity:   item.quantity,
    };
  }).filter(Boolean);
}

function loadAppliedDiscount() {
  try {
    const raw = JSON.parse(localStorage.getItem("kanka_discount") || "null");
    return raw?.code || null;
  } catch { return null; }
}

async function postJSON(url, payload) {
  const headers = { "Content-Type": "application/json" };
  /* Proves who's calling, server-side — the server no longer trusts
     any customer_id we might put in the payload itself. */
  const token = window.auth?.current?.access_token;
  if (token) headers.Authorization = `Bearer ${token}`;

  const res  = await fetch(url, {
    method:  "POST",
    headers,
    body:    JSON.stringify(payload),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(data.error || "Something went wrong. Please try again.");
    err.code = data.code;
    throw err;
  }
  return data;
}

/* ─── CheckoutPage ──────────────────────────────────────────────── */
function CheckoutPage() {
  const { cart, clearCart } = useCart();
  const [step,    setStep]    = useState(0);
  const [done,    setDone]    = useState(false);
  const [order,   setOrder]   = useState("");
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState("");
  const [info, setInfo] = useState({ email:"", phone:"", firstName:"", lastName:"", address:"", apt:"", city:"", state:"", zip:"", country:"India" });
  const [ship, setShip] = useState("standard");

  /* Displayed total — indicative only. The server recomputes it and
     the Razorpay popup shows the authoritative amount. */
  const cartTotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const shipCost  = 0;  /* free shipping on all orders */
  const shownTotal = Math.round(cartTotal + shipCost + cartTotal * 0.05);

  async function placeOrder() {
    if (loading) return;
    setError("");

    if (typeof window.Razorpay !== "function") {
      setError("Secure checkout couldn't load. Please check your connection and refresh the page.");
      return;
    }

    const items = buildServerItems(cart);
    if (items.length === 0) {
      setError("Your bag is empty or out of sync. Please refresh and try again.");
      return;
    }

    setLoading(true);
    try {
      /* 1. Server prices the order and creates a Razorpay order. */
      const created = await postJSON("/api/create-order", {
        items,
        discount_code:   loadAppliedDiscount(),
        shipping_method: ship,
        customer:        info,
      });

      /* 2. Hand off to Razorpay's iframe. Card data goes straight to
            them — this page never touches it. */
      const rzp = new window.Razorpay({
        key:       created.key_id,
        amount:    created.amount,
        currency:  created.currency,
        order_id:  created.razorpay_order_id,
        name:      "KANKA",
        description: `Order ${created.order_number}`,
        prefill:   created.prefill,
        notes:     { order_number: created.order_number },
        theme:     { color: "#1A1008" },

        /* 3. Success — confirm the signature server-side before we
              show anything to the customer. */
        handler: async (response) => {
          try {
            const verified = await postJSON("/api/verify-payment", {
              razorpay_order_id:   response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature:  response.razorpay_signature,
            });

            if (verified.verified) {
              localStorage.removeItem("kanka_discount");
              setOrder(verified.order_number || created.order_number);
              clearCart();
              setDone(true);
            } else if (verified.pending) {
              setOrder(created.order_number);
              clearCart();
              setDone(true);
            } else {
              setError("We couldn't verify that payment. If money left your account it is safe — please contact us with order " + created.order_number + ".");
            }
          } catch (e) {
            /* The webhook is the source of truth, so the order still
               completes server-side even if this call failed. */
            setError(e.message + " Your order reference is " + created.order_number + ".");
          } finally {
            setLoading(false);
          }
        },

        modal: {
          ondismiss: () => {
            setLoading(false);
            setError("Payment cancelled — your bag is still here whenever you're ready.");
          },
        },
      });

      rzp.on("payment.failed", (resp) => {
        setLoading(false);
        setError(resp?.error?.description || "That payment didn't go through. Please try another method.");
      });

      rzp.open();

    } catch (e) {
      setLoading(false);
      setError(e.message);
      /* Stock/price problems belong back on the bag screen. */
      if (["OUT_OF_STOCK","PRODUCT_MISSING","VARIANT_MISSING","PRODUCT_INACTIVE"].includes(e.code)) {
        setStep(0);
      }
    }
  }

  if (done) return (
    <div className="page-enter">
      <Navbar />
      <div>
        <SuccessScreen order={order} />
      </div>
    </div>
  );

  return (
    <div className="page-enter">
      <Navbar />
      <div style={{ minHeight:"80vh", background:"#FAF9F7" }}>
        <div className="container section-sm" style={{ paddingBottom:80 }}>
          <div style={{ textAlign:"center", marginBottom:8 }}>
            <h1 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(28px,4vw,44px)", fontWeight:500, color:"#1A1008", marginBottom:6 }}>Checkout</h1>
          </div>
          <ProgressBar step={step} />
          <div style={{ display:"flex", gap:40, alignItems:"flex-start", flexWrap:"wrap", justifyContent:"center" }}>
            {/* Form */}
            <div style={{ flex:1, minWidth:300, maxWidth:600 }}>
              {step===0 && <StepInfo data={info} setData={setInfo} onNext={() => setStep(1)} />}
              {step===1 && <StepShipping selected={ship} setSelected={setShip} onNext={() => setStep(2)} onBack={() => setStep(0)} />}
              {step===2 && <StepPayment onPlace={placeOrder} onBack={() => setStep(1)} loading={loading} error={error} total={shownTotal} />}
            </div>
            {/* Summary */}
            <CheckoutSummary shipping={shipCost} />
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { CheckoutPage });

})();
  </script>
