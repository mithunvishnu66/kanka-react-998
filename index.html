  <!-- Lazy image observer -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){e.target.classList.add('loaded');obs.unobserve(e.target);}});
    }, {threshold:0.05});
    function scan(){
      document.querySelectorAll('img[loading="lazy"]:not(.loaded)').forEach(img=>{
        if(img.complete) img.classList.add('loaded');
        else { img.addEventListener('load',()=>img.classList.add('loaded')); obs.observe(img); }
      });
    }
    scan();
    new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
  });
  </script>

window.PRODUCTS = [];

/* ─── SUPABASE LOADER ───────────────────────────────────────────────── */
window.loadKankaData = async function loadKankaData() {
  const query =
      "select=id,slug,name,description,details,price,original_price,"
    + "category,tags,rating,review_count,is_active,"
    + "product_images(url,sort_order),"
    + "product_colors(name,hex,sort_order),"
    + "product_variants(color,size,stock,sku)"
    + "&is_active=eq.true&order=created_at.asc";

  const res = await fetch(`${SUPABASE_URL}/rest/v1/products?${query}`, {
    headers: {
      apikey:        SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
    },
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} — ${await res.text()}`);
  const rows = await res.json();
  if (!Array.isArray(rows) || rows.length === 0) throw new Error("No products in database");

  const sizeOrder = ["XS","S","M","L","XL","XXL"];

  window.PRODUCTS = rows.map((p, idx) => {
    const images = (p.product_images || [])
      .slice().sort((a,b) => a.sort_order - b.sort_order)
      .map(i => i.url);
    const colors = (p.product_colors || [])
      .slice().sort((a,b) => a.sort_order - b.sort_order)
      .map(c => ({ name: c.name, hex: c.hex }));
    const sizes  = [...new Set((p.product_variants || []).map(v => v.size))]
      .sort((a,b) => sizeOrder.indexOf(a) - sizeOrder.indexOf(b));

    const stockMap = {};
    (p.product_variants || []).forEach(v => {
      stockMap[`${v.color}__${v.size}`] = v.stock;
    });

    return {
      id:            idx + 1,                  // numeric id (1..N) — keeps existing routing working
      uuid:          p.id,                     // real DB UUID (use for orders, cart sync later)
      slug:          p.slug,
      name:          p.name,
      price:         parseFloat(p.price),
      originalPrice: p.original_price ? parseFloat(p.original_price) : null,
      discount:      (p.original_price && parseFloat(p.original_price) > parseFloat(p.price))
                       ? Math.round((1 - parseFloat(p.price) / parseFloat(p.original_price)) * 100)
                       : 0,
      category:      p.category,
      tags:          p.tags || [],
      rating:        parseFloat(p.rating) || 0,
      reviewCount:   p.review_count || 0,
      description:   p.description || "",
      details:       p.details || [],
      images:        images.length ? images : ["https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&h=1000&auto=format&fit=crop&q=80"],
      /* ProductCard reads the singular `image`. Without this the grid
         thumbnails render broken while the detail page (which reads
         images[0]) looks fine. */
      image:         images[0] || "https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&h=1000&auto=format&fit=crop&q=80",
      colors:        colors.length ? colors : [{ name:"Default", hex:"#cccccc" }],
      sizes:         sizes.length  ? sizes  : ["M"],
      stockMap,
    };
  });

  /* Build CATEGORIES dynamically from live data */
  const counts = { all: window.PRODUCTS.length };
  window.PRODUCTS.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
  window.CATEGORIES = [
    { id:"all",    label:"All Products", count: counts.all    || 0 },
    { id:"kurta",  label:"Kurta",       count: counts.kurta  || 0 },
    { id:"tshirt", label:"T-Shirt",     count: counts.tshirt || 0 },
    { id:"dhoti",  label:"Dhoti Pant",  count: counts.dhoti  || 0 },
  ];

  console.log(`[Kanka] ✓ Loaded ${window.PRODUCTS.length} products from Supabase`);
  return true;
};

/* ─── AUTHENTICATION HELPERS ────────────────────────────────────────── */
/* These use Supabase Auth REST API directly (no library).
   Session token is stored in localStorage so users stay logged in. */

const AUTH_KEY = "kanka_session";

function _getSession() {
  try {
    const s = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    if (!s?.access_token || !s?.user) return null;
    // Check if JWT is expired (JWT exp is in seconds)
    try {
      const payload = JSON.parse(atob(s.access_token.split('.')[1]));
      if (payload.exp && payload.exp * 1000 < Date.now()) {
        localStorage.removeItem(AUTH_KEY);
        return null;
      }
    } catch {}
    return s;
  } catch { return null; }
}
function _saveSession(s) {
  if (s) localStorage.setItem(AUTH_KEY, JSON.stringify(s));
  else localStorage.removeItem(AUTH_KEY);
}

window.auth = {
  /* Current logged-in user (or null) */
  current: _getSession(),

  /* Sign up new user — auto-creates customer profile via DB trigger */
  async signup(email, password, fullName) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({
        email, password,
        data: { full_name: fullName },
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || "Sign-up failed");
    if (data.access_token) {
      const session = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user: data.user,
      };
      _saveSession(session);
      this.current = session;
    }
    return data;
  },

  /* Login with email + password */
  async login(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Login failed");
    const session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user: data.user,
    };
    _saveSession(session);
    this.current = session;
    return session;
  },

  /* Logout — clear stored session */
  async logout() {
    const s = this.current;
    if (s?.access_token) {
      try {
        await fetch(`${SUPABASE_URL}/auth/v1/logout`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${s.access_token}`,
          },
        });
      } catch {}
    }
    _saveSession(null);
    this.current = null;
  },

  /* Send password reset email */
  async resetPassword(email) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.msg || "Could not send reset email");
    }
    return true;
  },

  /* Get logged-in user's customer profile from DB */
  async getProfile() {
    if (!this.current) return null;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${this.current.user.id}&select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
      },
    });
    const rows = await res.json();
    return Array.isArray(rows) ? rows[0] : null;
  },

  /* Update profile (full_name, phone, marketing_consent) */
  async updateProfile(updates) {
    if (!this.current) throw new Error("Not logged in");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${this.current.user.id}`, {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
      },
      body: JSON.stringify(updates),
    });
    if (!res.ok) throw new Error("Failed to update profile");
    return (await res.json())[0];
  },

  /* Get user's orders */
  async getOrders() {
    if (!this.current) return [];
    const q = "select=*,order_items(*)&order=created_at.desc";
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?${q}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${this.current.access_token}`,
      },
    });
    if (!res.ok) return [];
    return await res.json();
  },

  /* ── Address local-storage helpers ── */
  _addrKey() { return "kanka_addresses_" + (this.current?.user?.id || "guest"); },
  _localAddresses() { try { return JSON.parse(localStorage.getItem(this._addrKey()) || "[]"); } catch { return []; } },
  _saveLocalAddresses(list) { localStorage.setItem(this._addrKey(), JSON.stringify(list)); },

  /* Get user's saved addresses — tries Supabase, falls back to localStorage */
  async getAddresses() {
    if (!this.current) return [];
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/addresses?select=*&order=is_default.desc,created_at.desc`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${this.current.access_token}`,
        },
      });
      if (res.ok) {
        const remote = await res.json();
        if (Array.isArray(remote)) {
          /* Merge: remote takes priority; keep any local-only entries */
          const local = this._localAddresses();
          const remoteIds = new Set(remote.map(a => String(a.id)));
          const localOnly = local.filter(a => !remoteIds.has(String(a.id)));
          return [...remote, ...localOnly];
        }
      }
    } catch (e) { /* fall through */ }
    /* Supabase failed — return what we have locally */
    return this._localAddresses();
  },

  /* Save a new address — tries Supabase, always saves to localStorage as backup */
  async addAddress(addr) {
    if (!this.current) throw new Error("Not logged in");
    const body = { ...addr, customer_id: this.current.user.id };

    /* Optimistic local save first so the UI never appears to lose data */
    const tempId  = "local_" + Date.now();
    const localEntry = { ...addr, id: tempId, created_at: new Date().toISOString() };
    const existing   = this._localAddresses();
    this._saveLocalAddresses([localEntry, ...existing]);

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/addresses`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${this.current.access_token}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        const data   = await res.json();
        const saved  = Array.isArray(data) ? data[0] : data;
        if (saved?.id) {
          /* Replace the temp local entry with the real DB-saved one */
          const updated = this._localAddresses().map(a => a.id === tempId ? saved : a);
          this._saveLocalAddresses(updated);
          return saved;
        }
      }
      /* Supabase rejected it — keep the local entry and return it */
      console.warn("[Kanka] addAddress: Supabase returned error, using local save");
    } catch (e) {
      console.warn("[Kanka] addAddress network error:", e.message);
    }
    return localEntry;
  },

  /* Delete an address */
  async deleteAddress(id) {
    if (!this.current) throw new Error("Not logged in");
    /* Always remove from local store */
    this._saveLocalAddresses(this._localAddresses().filter(a => String(a.id) !== String(id)));
    /* Try Supabase too (non-blocking) */
    if (!String(id).startsWith("local_")) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/addresses?id=eq.${id}`, {
          method: "DELETE",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${this.current.access_token}`,
          },
        });
      } catch (e) { /* ignore */ }
    }
    return true;
  },
};

/* ─── PERSISTENT CART STORAGE ───────────────────────────────────────── */
/* Guests:       cart lives in localStorage
   Logged in:    cart syncs to Supabase cart_items table
   On login:     guest cart merges into account cart                    */

const CART_KEY = "kanka_cart";

window.cartStore = {
  /* Load cart from browser storage (works for guests + logged-in) */
  loadLocal() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch { return []; }
  },
  saveLocal(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  },
  clearLocal() {
    localStorage.removeItem(CART_KEY);
  },

  /* Load cart from Supabase (requires login) */
  async loadRemote() {
    const auth = window.auth?.current;
    if (!auth) return [];
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?select=*&order=created_at.asc`,
        { headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
      if (!res.ok) return [];
      const rows = await res.json();
      // Transform DB rows -> cart item format the React components expect
      return rows.map(r => {
        const product = window.PRODUCTS.find(p => p.uuid === r.product_id);
        if (!product) return null;
        return {
          id:       product.id,
          uuid:     product.uuid,
          cartKey:  `${product.id}__${r.color}__${r.size}`,
          name:     product.name,
          price:    product.price,
          image:    product.images[0],
          color:    r.color,
          size:     r.size,
          quantity: r.quantity,
        };
      }).filter(Boolean);
    } catch (e) {
      console.warn("[Kanka] cart loadRemote failed:", e);
      return [];
    }
  },

  /* Sync cart to Supabase (replace-all strategy: delete old, insert new) */
  async saveRemote(cart) {
    const auth = window.auth?.current;
    if (!auth) return;
    try {
      // Delete all existing cart items for this user
      await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?customer_id=eq.${auth.user.id}`,
        { method: "DELETE", headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
      if (cart.length === 0) return;

      // Build rows with proper product UUID lookup
      const rows = cart.map(item => {
        const product = window.PRODUCTS.find(p => p.id === item.id);
        if (!product?.uuid) return null;
        return {
          customer_id: auth.user.id,
          product_id:  product.uuid,
          color:       item.color,
          size:        item.size,
          quantity:    item.quantity,
        };
      }).filter(Boolean);

      if (rows.length === 0) return;
      await fetch(`${SUPABASE_URL}/rest/v1/cart_items`, {
        method: "POST",
        headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(rows),
      });
    } catch (e) {
      console.warn("[Kanka] cart saveRemote failed:", e);
    }
  },

  /* Merge two carts — sum quantities when same item exists in both */
  mergeCarts(local, remote) {
    const merged = remote.map(i => ({ ...i }));
    local.forEach(localItem => {
      const existing = merged.find(m => m.cartKey === localItem.cartKey);
      if (existing) {
        existing.quantity = Math.min(existing.quantity + localItem.quantity, 10);
      } else {
        merged.push({ ...localItem });
      }
    });
    return merged;
  },

  /* Clear cart everywhere — called after successful order */
  async clearAll() {
    this.clearLocal();
    const auth = window.auth?.current;
    if (!auth) return;
    try {
      await fetch(
        `${SUPABASE_URL}/rest/v1/cart_items?customer_id=eq.${auth.user.id}`,
        { method: "DELETE", headers: {
          apikey:        SUPABASE_KEY,
          Authorization: `Bearer ${auth.access_token}`,
        }},
      );
    } catch (e) {
      console.warn("[Kanka] cart clearAll failed:", e);
    }
  },
};

  </script>

/* Live search suggestions — matches product names, categories and tags */
window.kkSuggest = function kkSuggest(q, limit) {
  const raw = (q || "").trim().toLowerCase();
  if (raw.length < 1) return [];
  const words = raw.split(/\s+/).filter(Boolean);
  /* Read PRODUCTS fresh on every call so anything added later — new rows
     from Supabase, admin uploads — is searchable with no code change. */
  const list = window.PRODUCTS || [];
  const scored = [];
  list.forEach(p => {
    const name = (p.name || "").toLowerCase();
    const cat  = (p.category || "").toLowerCase();
    const tags = (p.tags || []).join(" ").toLowerCase();
    /* Every text field a product can carry, so no product is unfindable. */
    const rest = [
      p.slug || "",
      p.description || "",
      (p.details || []).join(" "),
      (p.colors || []).map(c => c.name || "").join(" "),
      (p.sizes || []).join(" "),
      p.price != null ? String(p.price) : ""
    ].join(" ").toLowerCase();
    const hay = name + " " + cat + " " + tags + " " + rest;

    let score = -1;
    if (name.startsWith(raw)) score = 0;
    else if (name.includes(raw)) score = 1;
    else if (cat.includes(raw) || tags.includes(raw)) score = 2;
    else if (rest.includes(raw)) score = 3;
    /* Multi-word: every word must appear somewhere on the product. */
    else if (words.length > 1 && words.every(w => hay.includes(w))) score = 4;
    /* Last resort: forgive a trailing plural / typo character. */
    else if (raw.length > 3 && hay.includes(raw.slice(0, -1))) score = 5;
    if (score >= 0) scored.push({ p, score });
  });
  scored.sort((a, b) => a.score - b.score || (a.p.name || "").localeCompare(b.p.name || ""));
  return scored.slice(0, limit || 6).map(s => s.p);
};

/* ─── Navbar ────────────────────────────────────────────────────── */
function Navbar({ transparent = false, noSearch = false, overlay = false }) {
  const { cartCount } = useCart();
  const { navigate } = useApp();
  const [mobileOpen, setMobileOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState("");
  const suggestions = window.kkSuggest ? window.kkSuggest(query, 5) : [];

  const navLinks = [
  { label: "NEW IN", filter: "new" },
  { label: "DRESSES", filter: "all" },
  { label: "COLLECTIONS", filter: "collection" },
  { label: "SALE", filter: "sale" }];


  const iconColor = "#1A1008";

  return (
    <header className={"kk-navbar-head" + (overlay ? " kk-navbar-head--overlay" : "")} style={{ position: "relative", zIndex: 900, marginBottom: overlay ? -18 : 0 }}>

        height: 61,
        background: "#FAF7EE",
        borderRadius: "0 0 18px 18px",
        borderBottom: "1px solid rgba(26,16,8,0.12)",
        boxShadow: "0 8px 22px -12px rgba(10,6,2,0.55)",
        display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 40px", position: "relative"
      }}>
        {/* Left — logo */}
        <div style={{ flex: 1, display: "flex", alignItems: "center" }}>
          <div className="kk-navbar-lockup" style={{ display: "flex", alignItems: "center" }}>
          <button className="kk-navbar-logo-btn" onClick={() => navigate("home")} style={{
            background: "none", border: "none", cursor: "pointer", padding: 0,
            lineHeight: 0, transition: "opacity 0.35s", flexShrink: 0
          }}>
            <img src={KANKA_LOGO} alt="Kanka" className="kk-navbar-logo" style={{
              height: 54, width: "auto", objectFit: "contain", display: "block"
            }} />
          </button>
          <span className="kk-navbar-est" style={{
            marginLeft: 42,
            fontFamily: "'Cormorant Garamond', serif", fontSize: 11, letterSpacing: "0.22em",
            textTransform: "uppercase", color: iconColor, whiteSpace: "nowrap",
            transition: "color 0.35s"
          }}>Since 2015</span>
          </div>
        </div>

        {/* Center — nav links, or the inline search field when open */}
        {!(!noSearch && searchOpen) ?
        <div className="hide-mobile" style={{ display: "flex", gap: 32, justifyContent: "center" }}>
          {navLinks.map((l) =>
          <NavLink key={l.label} label={l.label} color={iconColor}
          onClick={() => navigate("listing", { listFilter: l.filter })} />
          )}
        </div> :
        <div className="hide-mobile" style={{
          position: "relative", width: 420, maxWidth: "42vw",
          transformOrigin: "right center",
          animation: "kkSearchOpen 0.34s cubic-bezier(0.22,1,0.36,1) both"
        }}>
          <div style={{
            display: "flex", alignItems: "center", gap: 10,
            paddingBottom: 4, position: "relative"
          }}>
            <span style={{
              position: "absolute", bottom: 0, left: 0, right: 0, height: 1,
              background: "#DDD0C0", transformOrigin: "right center",
              animation: "kkSearchRule 0.42s cubic-bezier(0.22,1,0.36,1) 0.06s both"
            }} />
            <IconSearch color="#8C7B6E" />
            <input
            autoFocus
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter" && query.trim()) {
                navigate("listing", { listFilter: "all", searchQuery: query.trim() });
                setSearchOpen(false);setQuery("");
              }
              if (e.key === "Escape") { setSearchOpen(false);setQuery(""); }
            }}
            placeholder="Search dresses, styles, fabrics…"
            style={{
              flex: 1, minWidth: 0, border: "none", background: "transparent", outline: "none",
              fontFamily: "Jost", fontSize: 14, letterSpacing: "0.02em", color: "#1A1008"
            }} />
          </div>

          {suggestions.length > 0 &&
            <div style={{
              position: "absolute", top: "calc(100% + 10px)", left: 0, right: 0, zIndex: 950,
              background: "#FFFFFF", border: "1px solid #E8E0D5",
              boxShadow: "0 18px 40px -20px rgba(26,16,8,0.35)",
              padding: 8, animation: "kkSuggestIn 0.24s cubic-bezier(0.22,1,0.36,1) both"
            }}>
              {suggestions.map(p => (
                <button key={p.id} onClick={() => { navigate("detail", { productId: p.id }); setSearchOpen(false); setQuery(""); }}

                  onMouseLeave={e => e.currentTarget.style.background = "none"}>

            </div>

              boxShadow: "0 18px 40px -20px rgba(26,16,8,0.35)",
              padding: "14px 16px", fontFamily: "Jost", fontSize: 13, color: "#8C7B6E"

}

/* ─── Primary Button ────────────────────────────────────────────── */
function PrimaryBtn({ children, onClick, full = false, light = false, outline = false, style: extra = {} }) {
  const [hov, setHov] = useState(false);
  const base = {
    fontFamily: "Jost", fontSize: 12, fontWeight: 600, letterSpacing: "0.14em",
    padding: "14px 32px", border: "1.5px solid", cursor: "pointer",
    transition: "all 0.25s", display: "inline-flex", alignItems: "center", gap: 8,
    borderRadius: 6, width: full ? "100%" : "auto", justifyContent: full ? "center" : "flex-start"
  };
  if (outline) Object.assign(base, {
    background: hov ? "#1A1008" : "transparent",
    borderColor: "#1A1008", color: hov ? "#FAF9F7" : "#1A1008"
  });else
  if (light) Object.assign(base, {
    background: hov ? "#F2EDE7" : "#FAF9F7",
    borderColor: "transparent", color: "#1A1008"
  });else
  Object.assign(base, {
    background: hov ? "#2D1B0E" : "#1A1008",
    borderColor: hov ? "#2D1B0E" : "#1A1008", color: "#FAF9F7"
  });
  return (
    <button onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
    style={{ ...base, ...extra }}>
      {children}
    </button>);

}

/* ─── Ticker ────────────────────────────────────────────────────── */
function Ticker() {
  const items = ["FREE SHIPPING OVER ₹5,000","COMPLIMENTARY RETURNS","SECURE CHECKOUT","CRAFTED WITH CARE","CRAFTED IN INDIA","NEW ARRIVALS NOW LIVE"];
  const text = [...items, ...items].join("   ·   ");
  return (
    <div style={{ background:"#1A1008", padding:"13px 0", overflow:"hidden" }}>
      <div className="marquee-track" style={{ fontFamily:"Jost", fontSize:10, fontWeight:500, letterSpacing:"0.16em", color:"#B8A99A", whiteSpace:"nowrap" }}>
        {[text, text].map((t, i) => <span key={i} style={{ paddingRight:60 }}>{t}</span>)}
      </div>
    </div>
  );
}

/* ─── Collections ───────────────────────────────────────────────── */
function Collections() {
  const { navigate } = useApp();
  const cols = window.COLLECTIONS;
  return (
    <section className="section" style={{ background:"#FAF9F7" }}>
      <div className="container">
        <SectionHeader label="CURATED FOR YOU" title="Shop by Collection" subtitle="Three worlds, one wardrobe. Find your story." />
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:20 }}>
          {cols.map((c, i) => (
            <CollectionCard key={c.id} collection={c} delay={i * 100}
              onShop={() => navigate("listing", { listFilter: c.filter })} />
          ))}
        </div>
      </div>
    </section>
  );
}

function CollectionCard({ collection: c, onShop, delay }) {
  const [hov, setHov] = useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      onClick={onShop}
      style={{
        position:"relative", borderRadius:12, overflow:"hidden", cursor:"pointer",
        aspectRatio:"3/4",
        boxShadow: hov ? "0 16px 48px rgba(0,0,0,0.15)" : "0 4px 16px rgba(0,0,0,0.07)",
        transition:"box-shadow 0.35s, transform 0.35s",
        transform: hov ? "translateY(-4px)" : "none",
        animationDelay: `${delay}ms`,
      }}>
      {c.slotId
        ? <div style={{ position:"absolute", inset:0 }}>
            <image-slot id={c.slotId} shape="rect" fit="cover"
              placeholder={`Drop a ${c.title} photo`}></image-slot>
          </div>
        : <img src={c.image} alt={c.title} style={{
            width:"100%", height:"100%", objectFit:"cover",
            transition:"transform 0.7s ease",
            transform: hov ? "scale(1.06)" : "scale(1)",
          }} />}
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", background:"linear-gradient(to top, rgba(10,6,2,0.75) 0%, rgba(10,6,2,0.2) 45%, transparent 70%)" }} />
      <div style={{ position:"absolute", bottom:0, left:0, right:0, padding:"28px 24px", pointerEvents:"none",
        transform: hov ? "translateY(-4px)" : "translateY(0)", transition:"transform 0.35s" }}>
        <p style={{ fontFamily:"Jost", fontSize:10, letterSpacing:"0.16em", color:"#C5A468", marginBottom:6 }}>{c.subtitle.toUpperCase()}</p>
        <h3 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:26, fontWeight:500, color:"#FAF9F7", marginBottom:14, lineHeight:1.1 }}>{c.title}</h3>
        <span style={{
          fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em",
          color:"#FAF9F7", display:"inline-flex", alignItems:"center", gap:8,
          borderBottom: hov ? "1px solid #C5A468" : "1px solid transparent",
          paddingBottom:2, transition:"border-color 0.25s",
        }}>{c.cta} <IconArrowRight size={14}/></span>
      </div>
    </div>
  );
}

/* ─── Trending Now ──────────────────────────────────────────────── */
function TrendingSection() {
  const { navigate } = useApp();
  /* Prefer tagged products, but never show an empty section — fall back
     to the most recent products so the homepage populates itself as the
     catalogue grows, with no tagging required. */
  const tagged   = window.PRODUCTS.filter(p => p.tags.includes("new") || p.tags.includes("bestseller"));
  const trending = (tagged.length ? tagged : window.PRODUCTS).slice(0, 4);
  return (
    <section className="section" style={{ background:"#F7F3EE" }}>
      <div className="container">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:48, flexWrap:"wrap", gap:16 }}>
          <SectionHeader label="TRENDING NOW" title="The Season's Favourites" center={false} />
          <button onClick={() => navigate("listing",{listFilter:"all"})} style={{
            background:"none", border:"none", cursor:"pointer",

/* ─── Accordion ─────────────────────────────────────────────────── */
function Accordion({ title, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderBottom:"1px solid #EDE8E0" }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width:"100%", background:"none", border:"none", cursor:"pointer",
        display:"flex", justifyContent:"space-between", alignItems:"center",
        padding:"18px 0", fontFamily:"Jost", fontSize:12, fontWeight:600,
        letterSpacing:"0.1em", color:"#1A1008", minHeight:44,
      }}>
        {title}
        <span style={{ fontSize:18, fontWeight:300, transform: open ? "rotate(45deg)" : "rotate(0)", transition:"transform 0.25s" }}>+</span>
      </button>
      {open && (
        <div style={{ paddingBottom:18, animation:"fadeIn 0.2s ease" }}>
          {children}

    </div>
  );

/* ─── Sticky Mobile Add-to-Bag Bar ──────────────────────────────── */
function StickyMobileBar({ product, selSize, selColor, qty, setQty, added, sizeErr, wished, setWished, onAdd, onBuyNow, setSizeErr, setSelSize }) {
  const barRef = useRef(null);

  /* Once the footer appears, slide the bar out of the way. Leaving it
     pinned over the footer makes the price look like it belongs to the
     footer rather than the product. */
  useEffect(() => {
    const footer = document.querySelector("footer");
    const bar    = barRef.current;
    if (!footer || !bar || !("IntersectionObserver" in window)) return;

    const io = new IntersectionObserver(
      ([entry]) => bar.classList.toggle("bar-hidden", entry.isIntersecting),
      { rootMargin: "0px 0px -40px 0px" }
    );
    io.observe(footer);
    return () => io.disconnect();
  }, []);

  return (
    <div ref={barRef} style={{
      position:"fixed", bottom:64, left:0, right:0,
      background:"#FAF9F7",
      borderTop:"1px solid #EDE8E0",
      padding:"12px 16px",
      zIndex:90,
      display:"none",  /* shown via CSS on mobile */
      gap:10,
      boxShadow:"0 -4px 16px rgba(0,0,0,0.06)",
    }} className="mobile-sticky-bar">

      {/* Price */}
      <div style={{ display:"flex", flexDirection:"column", justifyContent:"center", minWidth:60 }}>
        <span style={{ fontFamily:"Cormorant Garamond, serif", fontSize:20, fontWeight:500, color:"#1A1008", lineHeight:1 }}>
          ₹{product.price.toLocaleString("en-IN")}
        </span>
        {product.originalPrice && product.originalPrice > product.price && (
          <span style={{ fontFamily:"Jost", fontSize:11, color:"#B8A99A", textDecoration:"line-through" }}>
            ₹{product.originalPrice.toLocaleString("en-IN")}
          </span>
        )}
      </div>

      {/* Qty control */}
      <div style={{ display:"flex", alignItems:"center", border:"1.5px solid #E8E0D5", borderRadius:8, overflow:"hidden", flexShrink:0 }}>
        <button onClick={() => setQty(q => Math.max(1,q-1))} style={{
          width:38, height:48, background:"none", border:"none", cursor:"pointer", fontSize:18, color:"#6B5744",
        }}>−</button>
        <span style={{ width:32, textAlign:"center", fontFamily:"Jost", fontSize:13, fontWeight:500 }}>{qty}</span>
        <button onClick={() => setQty(q => Math.min(10,q+1))} style={{
          width:38, height:48, background:"none", border:"none", cursor:"pointer", fontSize:18, color:"#6B5744",
        }}>+</button>
      </div>

      {/* Add to bag */}
      <button onClick={onAdd} style={{
        flex:1, height:48,
        background: added ? "#2D5A1B" : sizeErr ? "#C0392B" : "#1A1008",
        color:"#FAF9F7", border:"none",
        fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.12em",
        borderRadius:8, cursor:"pointer", transition:"background 0.25s",
        display:"flex", alignItems:"center", justifyContent:"center", gap:6,
      }}>
        {added ? <><IconCheck size={13}/> ADDED</> : sizeErr ? "SELECT SIZE" : "ADD TO BAG"}
      </button>

      {/* Buy now */}
      <button onClick={onBuyNow} style={{
        height:48, padding:"0 14px",
        background:"transparent", border:"1.5px solid #1A1008",
        color:"#1A1008", fontFamily:"Jost", fontSize:11, fontWeight:600,
        letterSpacing:"0.1em", borderRadius:8, cursor:"pointer", flexShrink:0,
      }}>BUY</button>
    </div>
  );
}

function PromoCode() {
  const { cartTotal } = useCart();
  const [code,    setCode]    = useState("");

  });
  const [err,     setErr]     = useState("");
  const [busy,    setBusy]    = useState(false);

  /* Checked against the discount_codes table — and checked again,

  async function apply() {
    if (busy || !code.trim()) return;
    setBusy(true); setErr("");
    try {
      const res = await fetch("/api/validate-discount", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ code, subtotal: cartTotal }),
      });
      const data = await res.json();
      if (!res.ok || !data.valid) {
        setErr(data.error || "That code isn't valid.");
      } else {
        const saved = { code: data.code, discount: data.discount, label: data.label };
        localStorage.setItem("kanka_discount", JSON.stringify(saved));
        setApplied(saved);
        setCode("");
      }
    } catch {
      setErr("Couldn't check that code right now. Please try again.");
    } finally {
      setBusy(false);
    }
  }

    localStorage.removeItem("kanka_discount");
    setApplied(null);

/* Cart lines are stripped down to identity only. No prices leave the
   browser — the server looks up every rupee itself. */
function buildServerItems(cart) {
  return cart.map(item => {
    const product = (window.PRODUCTS || []).find(p => p.uuid === item.uuid || p.id === item.id);
    if (!product?.uuid) return null;
    return {
      product_id: product.uuid,
      color:      item.color,
      size:       item.size,
      quantity:   item.quantity,
    };
  }).filter(Boolean);
}

function loadAppliedDiscount() {
  try {
    const raw = JSON.parse(localStorage.getItem("kanka_discount") || "null");
    return raw?.code || null;
  } catch { return null; }
}

async function postJSON(url, payload) {
  const headers = { "Content-Type": "application/json" };
  /* Proves who's calling, server-side — the server no longer trusts
     any customer_id we might put in the payload itself. */
  const token = window.auth?.current?.access_token;
  if (token) headers.Authorization = `Bearer ${token}`;

  const res  = await fetch(url, {
    method:  "POST",
    headers,
    body:    JSON.stringify(payload),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(data.error || "Something went wrong. Please try again.");
    err.code = data.code;
    throw err;
  }
  return data;
}

  const [ship, setShip] = useState("standard");

     the Razorpay popup shows the authoritative amount. */
  const cartTotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const shipCost  = 0;  /* free shipping on all orders */
  const shownTotal = Math.round(cartTotal + shipCost + cartTotal * 0.05);

  async function placeOrder() {
    if (loading) return;
    setError("");

    if (typeof window.Razorpay !== "function") {
      setError("Secure checkout couldn't load. Please check your connection and refresh the page.");
      return;
    }

    const items = buildServerItems(cart);
    if (items.length === 0) {
      setError("Your bag is empty or out of sync. Please refresh and try again.");
      return;
    }

    setLoading(true);
    try {
      /* 1. Server prices the order and creates a Razorpay order. */
      const created = await postJSON("/api/create-order", {
        items,
        discount_code:   loadAppliedDiscount(),
        shipping_method: ship,
        customer:        info,
      });

            them — this page never touches it. */
      const rzp = new window.Razorpay({
        key:       created.key_id,
        amount:    created.amount,
        currency:  created.currency,
        order_id:  created.razorpay_order_id,
        name:      "KANKA",
        description: `Order ${created.order_number}`,
        prefill:   created.prefill,
        notes:     { order_number: created.order_number },
        theme:     { color: "#1A1008" },

        /* 3. Success — confirm the signature server-side before we
              show anything to the customer. */
        handler: async (response) => {
          try {
            const verified = await postJSON("/api/verify-payment", {
              razorpay_order_id:   response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature:  response.razorpay_signature,
            });

            if (verified.verified) {
              localStorage.removeItem("kanka_discount");
              setOrder(verified.order_number || created.order_number);
              clearCart();
              setDone(true);
            } else if (verified.pending) {
              setOrder(created.order_number);
              clearCart();
              setDone(true);
            } else {
              setError("We couldn't verify that payment. If money left your account it is safe — please contact us with order " + created.order_number + ".");
            }
          } catch (e) {
            /* The webhook is the source of truth, so the order still
               completes server-side even if this call failed. */
            setError(e.message + " Your order reference is " + created.order_number + ".");
          } finally {
            setLoading(false);
          }
        },

        modal: {
          ondismiss: () => {
            setLoading(false);
            setError("Payment cancelled — your bag is still here whenever you're ready.");
          },
        },
      });

      rzp.on("payment.failed", (resp) => {
        setLoading(false);
        setError(resp?.error?.description || "That payment didn't go through. Please try another method.");
      });

      rzp.open();

    } catch (e) {
      setLoading(false);
      setError(e.message);
      /* Stock/price problems belong back on the bag screen. */
      if (["OUT_OF_STOCK","PRODUCT_MISSING","VARIANT_MISSING","PRODUCT_INACTIVE"].includes(e.code)) {
        setStep(0);
      }
    }
  }

  if (done) return (
    <div className="page-enter">
      <Navbar />
      <div>
        <SuccessScreen order={order} />
      </div>
    </div>
  );

  return (
    <div className="page-enter">
      <Navbar />
      <div style={{ minHeight:"80vh", background:"#FAF9F7" }}>
        <div className="container section-sm" style={{ paddingBottom:80 }}>
          <div style={{ textAlign:"center", marginBottom:8 }}>
            <h1 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(28px,4vw,44px)", fontWeight:500, color:"#1A1008", marginBottom:6 }}>Checkout</h1>
          </div>
          <ProgressBar step={step} />
          <div style={{ display:"flex", gap:40, alignItems:"flex-start", flexWrap:"wrap", justifyContent:"center" }}>
            {/* Form */}
            <div style={{ flex:1, minWidth:300, maxWidth:600 }}>
              {step===0 && <StepInfo data={info} setData={setInfo} onNext={() => setStep(1)} />}
              {step===1 && <StepShipping selected={ship} setSelected={setShip} onNext={() => setStep(2)} onBack={() => setStep(0)} />}
              {step===2 && <StepPayment onPlace={placeOrder} onBack={() => setStep(1)} loading={loading} error={error} total={shownTotal} />}
            </div>
            {/* Summary */}
            <CheckoutSummary shipping={shipCost} />
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { CheckoutPage });

})();

function LoginPage() {
  const { navigate } = useApp();
  const [step,    setStep]    = useState("phone"); // "phone" | "otp"
  const [phone,   setPhone]   = useState("");
  const [country, setCountry] = useState("+91");
  const [otp,     setOtp]     = useState(["","","","","",""]);
  const [timer,   setTimer]   = useState(0);
  const [busy,    setBusy]    = useState(false);

  useEffect(() => {
    if (timer <= 0) return;
    const t = setTimeout(() => setTimer(t2 => t2 - 1), 1000);

  async function sendOTP() {
    setErr("");
    const fullPhone = country + phone.replace(/\D/g,"");
    if (phone.replace(/\D/g,"").length < 7) { setErr("Please enter a valid phone number"); return; }
    setBusy(true);
    try {
      const res = await fetch(`${window.SUPABASE_URL}/auth/v1/otp`, {
        method:"POST",
        headers:{ apikey: window.SUPABASE_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ phone: fullPhone }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || "Failed to send OTP");
      setStep("otp");
      setTimer(30);
    } catch(e) { setErr(e.message); }

    if (!/^\d*$/.test(val)) return;
    const next = [...otp];
    next[i] = val.slice(-1);
    setOtp(next);
    if (val && i < 5) document.getElementById(`otp-${i+1}`)?.focus();
    if (next.every(d => d) && next.join("").length === 6) verifyOTP(next.join(""));
  }

  function handleOtpKey(i, e) {
    if (e.key === "Backspace" && !otp[i] && i > 0) document.getElementById(`otp-${i-1}`)?.focus();
    if (e.key === "Enter" && otp.every(d => d)) verifyOTP(otp.join(""));
  }

  function handleOtpPaste(e) {
    const pasted = e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6);

        body: JSON.stringify({ phone: fullPhone, token: code }),
      });

      const session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };

      window.auth.current = session;
      window.notifyAuthChange?.();
      navigate("account");

      setErr(e.message);
      setOtp(["","","","","",""]);
      document.getElementById("otp-0")?.focus();
    }

      <div style={{ background:"#F7F3EE", borderRadius:8, padding:"10px 14px", marginBottom:20 }}>
        <p style={{ fontFamily:"Jost", fontSize:11, color:"#8C7B6E", lineHeight:1.6 }}>
          🔐 Test mode: OTP is always <strong style={{ color:"#1A1008" }}>123456</strong>. No real SMS sent yet.
        </p>
      </div>

      <button onClick={sendOTP} disabled={busy} style={{
        width:"100%", height:52, background: busy ? "#B8A99A" : "#1A1008",
        color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:12,
        fontWeight:600, letterSpacing:"0.15em", borderRadius:8,
        cursor: busy ? "not-allowed" : "pointer", display:"flex",
        alignItems:"center", justifyContent:"center", gap:8,
      }}>
        {busy ? "SENDING…" : <>"SEND OTP" <IconArrowRight size={15}/></>}
      </button>

      <p style={{ fontFamily:"Jost", fontSize:11, color:"#8C7B6E", textAlign:"center", marginTop:20, lineHeight:1.7 }}>
        New or returning customer — same process.<br/>Account created automatically on first login.
      </p>
    </AuthCard>
  );

  /* ── STEP 2: OTP Verification ── */
  return (
    <AuthCard
      title="Enter Code"
      subtitle={`Sent to ${country} ${phone}`}
      footer={
        <div style={{ display:"flex", flexDirection:"column", gap:10, alignItems:"center" }}>
          {timer > 0
            ? <p style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E" }}>Resend OTP in {timer}s</p>
            : <button style={F.link} onClick={() => { setOtp(["","","","","",""]); sendOTP(); }}>Resend OTP</button>
          }
          <button style={{ ...F.link, color:"#6B5744" }} onClick={() => { setStep("phone"); setErr(""); setOtp(["","","","","",""]); }}>
            ← Change number
          </button>
        </div>
      }
    >
      {err && <div style={F.err}>{err}</div>}

      {/* 6 OTP boxes */}
      <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:28 }} onPaste={handleOtpPaste}>
        {otp.map((d, i) => (
          <input
            key={i}
            id={`otp-${i}`}
            type="tel"
            maxLength={1}
            value={d}
            autoFocus={i === 0}
            onChange={e => handleOtpInput(i, e.target.value)}
            onKeyDown={e => handleOtpKey(i, e)}
            style={{
              width:46, height:56, textAlign:"center",
              fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500, color:"#1A1008",
              border: d ? "2px solid #1A1008" : "1.5px solid #E8E0D5",
              borderRadius:10, outline:"none", background:"#fff",
              transition:"border-color 0.2s",
            }}
          />
        ))}
      </div>

      <button onClick={() => verifyOTP(otp.join(""))} disabled={busy || otp.some(d => !d)} style={{
        width:"100%", height:52,
        background: busy ? "#B8A99A" : otp.every(d => d) ? "#1A1008" : "#E8E0D5",
        color: otp.every(d => d) ? "#FAF9F7" : "#8C7B6E",
        border:"none", fontFamily:"Jost", fontSize:12, fontWeight:600,
        letterSpacing:"0.15em", borderRadius:8,
        cursor: busy || otp.some(d => !d) ? "not-allowed" : "pointer",
        display:"flex", alignItems:"center", justifyContent:"center", gap:8,
        transition:"all 0.2s",
      }}>
        {busy ? "VERIFYING…" : <><IconCheck size={15}/> VERIFY</>}
      </button>
    </AuthCard>
  );
}

/* ─── Addresses Page ────────────────────────────────────────────── */
function AddressesPage() {
  const [addresses, setAddresses] = useState(null);
  const [showForm, setShowForm]   = useState(false);
  const [busy, setBusy]           = useState(false);
  const [err, setErr]             = useState("");
  const [form, setForm]           = useState({ label:"Home", full_name:"", phone:"", line1:"", line2:"", city:"", state:"", postal_code:"", country:"IN", is_default:false });

  useEffect(() => { window.auth.getAddresses().then(setAddresses); }, []);

  async function save(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const saved = await window.auth.addAddress(form);
      setAddresses(a => [saved, ...(a || [])]);
      setShowForm(false);
      /* Reset form for next use */
      setForm({ label:"Home", full_name:"", phone:"", line1:"", line2:"", city:"", state:"", postal_code:"", country:"IN", is_default:false });
    } catch(e2) { setErr(e2.message || "Could not save address. Please try again."); }
    finally { setBusy(false); }
  }

  async function remove(id) {
    if (!confirm("Delete this address?")) return;
    await window.auth.deleteAddress(id);
    setAddresses(a => a.filter(x => x.id !== id));
  }

  return (
    <AccountLayout active="addresses">
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24, flexWrap:"wrap", gap:12 }}>
        <h2 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500 }}>Saved Addresses</h2>
        {!showForm && (
          <button onClick={() => setShowForm(true)} style={{
            background:"#1A1008", color:"#FAF9F7", border:"none",
            fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em",
            padding:"12px 22px", borderRadius:8, cursor:"pointer",
          }}>+ ADD ADDRESS</button>
        )}
      </div>

      {showForm && (
        <form onSubmit={save} style={{ background:"#F7F3EE", borderRadius:12, padding:24, marginBottom:24 }}>
          {err && <div style={F.err}>{err}</div>}
          <div className="two-col" style={{ gap:14, marginBottom:14 }}>
            <div><label style={F.label}>FULL NAME *</label><input required value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>PHONE *</label><input required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} style={F.input} /></div>
          </div>
          <div style={{ marginBottom:14 }}><label style={F.label}>ADDRESS LINE 1 *</label><input required value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} style={F.input} /></div>
          <div style={{ marginBottom:14 }}><label style={F.label}>ADDRESS LINE 2</label><input value={form.line2} onChange={e=>setForm({...form,line2:e.target.value})} style={F.input} /></div>
          <div style={{ display:"grid", gridTemplateColumns:"2fr 2fr 1fr", gap:14, marginBottom:18 }}>
            <div><label style={F.label}>CITY *</label><input required value={form.city} onChange={e=>setForm({...form,city:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>STATE *</label><input required value={form.state} onChange={e=>setForm({...form,state:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>PIN *</label><input required value={form.postal_code} onChange={e=>setForm({...form,postal_code:e.target.value})} style={F.input} /></div>
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <button type="submit" disabled={busy} style={{ background:"#1A1008", color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer" }}>{busy ? "SAVING…" : "SAVE"}</button>
            <button type="button" onClick={() => setShowForm(false)} style={{ background:"transparent", color:"#1A1008", border:"1.5px solid #1A1008", fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer" }}>CANCEL</button>
          </div>
        </form>
      )}

      {addresses === null && <p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>Loading…</p>}
      {addresses?.length === 0 && !showForm && (
        <div style={{ textAlign:"center", padding:"60px 20px", background:"#F7F3EE", borderRadius:12 }}>
          <div style={{ fontSize:40, marginBottom:14 }}>📍</div>
          <h3 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:24, fontWeight:500, marginBottom:10 }}>No saved addresses</h3>
          <button onClick={() => setShowForm(true)} style={{ background:"#1A1008", color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer", marginTop:14 }}>+ ADD ADDRESS</button>
        </div>
      )}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))", gap:16 }}>
        {addresses?.map(a => (
          <div key={a.id} style={{ background:"#fff", border:"1px solid #EDE8E0", borderRadius:12, padding:"20px 22px", position:"relative" }}>
            {a.is_default && <span style={{ position:"absolute", top:14, right:14, fontFamily:"Jost", fontSize:10, fontWeight:600, color:"#C5A468", background:"#FDF5E8", padding:"3px 10px", borderRadius:4 }}>DEFAULT</span>}
            <p style={{ fontFamily:"Jost", fontSize:10, fontWeight:600, letterSpacing:"0.13em", color:"#8C7B6E", marginBottom:8 }}>{a.label?.toUpperCase()}</p>
            <p style={{ fontFamily:"Jost", fontSize:14, fontWeight:600, color:"#1A1008", marginBottom:6 }}>{a.full_name}</p>
            <p style={{ fontFamily:"Jost", fontSize:13, color:"#6B5744", lineHeight:1.7 }}>{a.line1}{a.line2 && `, ${a.line2}`}<br/>{a.city}, {a.state} {a.postal_code}<br/>{a.phone}</p>
            <button onClick={() => remove(a.id)} style={{ marginTop:12, background:"none", border:"none", cursor:"pointer", fontFamily:"Jost", fontSize:12, color:"#C0392B", textDecoration:"underline", textUnderlineOffset:3 }}>Delete</button>
          </div>
        ))}
      </div>
    </AccountLayout>
  );
}

/* ─── Profile Page ──────────────────────────────────────────────── */
function ProfilePage() {
  const [profile, setProfile] = useState(null);
  const [form,    setForm]    = useState({ full_name:"", marketing_consent:false });
  const [busy,    setBusy]    = useState(false);
  const [success, setSuccess] = useState(false);
  const [err,     setErr]     = useState("");

  useEffect(() => {
    window.auth.getProfile().then(p => {
      setProfile(p);
      if (p) setForm({ full_name: p.full_name || "", marketing_consent: p.marketing_consent || false });
    });
  }, []);

  async function save(e) {
    e.preventDefault(); setErr(""); setSuccess(false); setBusy(true);
    try { await window.auth.updateProfile(form); setSuccess(true); setTimeout(() => setSuccess(false), 3000); }
    catch(e2) { setErr(e2.message); }
    finally { setBusy(false); }
  }

  if (!profile) return <AccountLayout active="profile"><p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>Loading…</p></AccountLayout>;

  return (
    <AccountLayout active="profile">
      <h2 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500, marginBottom:24 }}>Profile Settings</h2>
      <form onSubmit={save} style={{ maxWidth:480 }}>
        {err && <div style={F.err}>{err}</div>}
        {success && <div style={F.ok}>✓ Profile updated</div>}
        <div style={{ marginBottom:18 }}>
          <label style={F.label}>PHONE</label>
          <input value={window.auth.current?.user?.phone || ""} disabled style={{ ...F.input, background:"#F7F3EE", color:"#8C7B6E", cursor:"not-allowed" }} />
        </div>
        <div style={{ marginBottom:18 }}>
          <label style={F.label}>FULL NAME</label>
          <input value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} style={F.input} />
        </div>
        <label style={{ display:"flex", alignItems:"center", gap:10, fontFamily:"Jost", fontSize:13, color:"#6B5744", marginBottom:24, cursor:"pointer" }}>
          <input type="checkbox" checked={form.marketing_consent} onChange={e => setForm({...form, marketing_consent: e.target.checked})} />
          Send me Kanka offers and updates
        </label>
        <button type="submit" disabled={busy} style={{ background:"#1A1008", color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.13em", padding:"14px 28px", borderRadius:8, cursor:"pointer" }}>
          {busy ? "SAVING…" : "SAVE CHANGES"}
        </button>
      </form>
    </AccountLayout>
  );
}

});

})();

          <button className="mobile-nav-item" onClick={openSearch} aria-label="Search">
            <IconSearchM />
            <span className="mobile-nav-label">SEARCH</span>
          </button>
          <button className={`mobile-nav-item ${isCart ? "active" : ""}`} onClick={() => navigate("cart")} aria-label="Cart">
            <IconBagM filled={isCart} />
            {cartCount > 0 && <span className="mobile-nav-badge">{cartCount}</span>}
            <span className="mobile-nav-label">BAG</span>
          </button>
          {window.ACCOUNTS_ENABLED && (
          <button className={`mobile-nav-item ${isAccount ? "active" : ""}`} onClick={accountClick} aria-label="Account">
            <IconUserM filled={isAccount} />
            <span className="mobile-nav-label">ME</span>
          </button>
          )}
        </div>
      </nav>

      <MobileSearchDrawer open={searchOpen} onClose={() => setSearchOpen(false)} />
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════ */
/* MOBILE SEARCH DRAWER                                                */
/* ═══════════════════════════════════════════════════════════════════ */
function MobileSearchDrawer({ open, onClose }) {
  const { navigate, route } = useAppM();
  const [query, setQuery] = useStateM("");
  const suggestions = window.kkSuggest ? window.kkSuggest(query, 6) : [];
  const authPages = ["login","signup","forgot","account","orders","addresses","profile"];
  const isAuthPage = authPages.includes(route?.page);

  function search(e) {
    e?.preventDefault();
    if (!query.trim() || isAuthPage) return;
    navigate("listing", { listFilter: "all", searchQuery: query });
    setQuery("");
    onClose();
  }

  function quickPick(term) {
    if (isAuthPage) return;
    navigate("listing", { listFilter: "all", searchQuery: term });
    setQuery("");
    onClose();
  }

  useEffectM(() => {
    if (open) document.body.style.overflow = "hidden";
    else document.body.style.overflow = "";
    return () => { document.body.style.overflow = ""; };
  }, [open]);

  return (
    <>
      <div className={`mobile-drawer-overlay ${open ? "open" : ""}`} onClick={onClose} />
      <div className={`mobile-drawer ${open ? "open" : ""}`} role="dialog" aria-label="Search">
        <div className="mobile-drawer-handle" />
        <div className="mobile-drawer-header">
          <h3 style={{ fontFamily: "Cormorant Garamond, serif", fontSize: 22, fontWeight: 500, color: "#1A1008" }}>Search</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#8C7B6E", lineHeight: 0, padding: 8 }} aria-label="Close">
            <IconXM size={20} />
          </button>
        </div>
        <form onSubmit={search} style={{ padding: "20px" }}>
          <input
            autoFocus
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Search for dresses, colors, styles…"
            style={{
              width: "100%", fontFamily: "Jost", fontSize: 16,
              padding: "14px 18px",
              border: "1.5px solid #E8E0D5",
              borderRadius: 10, outline: "none", color: "#1A1008",
              background: "#fff",
            }}
          />
          {suggestions.length > 0 &&
            <div style={{ marginTop: 16, borderTop: "1px solid #EDE8E0", paddingTop: 8 }}>
              {suggestions.map(p => (
                <button key={p.id} type="button"
                  onClick={() => { navigate("detail", { productId: p.id }); setQuery(""); onClose(); }}
                  style={{
                    width: "100%", display: "flex", alignItems: "center", gap: 14,
                    background: "none", border: "none", cursor: "pointer",
                    padding: "10px 2px", textAlign: "left", minHeight: 64
                  }}>
                  <img src={p.image} alt="" style={{ width: 46, height: 58, objectFit: "cover", borderRadius: 4, background: "#F7F3EE" }} />
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: "block", fontFamily: "Jost", fontSize: 14, color: "#1A1008", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</span>
                    <span style={{ display: "block", fontFamily: "Jost", fontSize: 11, letterSpacing: "0.1em", color: "#8C7B6E", textTransform: "uppercase" }}>{p.category}</span>
                  </span>
                  <span style={{ fontFamily: "Cormorant Garamond, serif", fontSize: 16, color: "#1A1008" }}>₹{(p.price || 0).toLocaleString("en-IN")}</span>
                </button>
              ))}
              <button type="button" onClick={search} style={{
                width: "100%", background: "none", border: "none", cursor: "pointer",
                fontFamily: "Jost", fontSize: 11, fontWeight: 600, letterSpacing: "0.13em",
                color: "#7B1E1E", padding: "12px 2px 4px", textAlign: "left"
              }}>SEE ALL RESULTS</button>
            </div>
          }
          {query.trim().length > 0 && suggestions.length === 0 &&
            <p style={{ marginTop: 16, fontFamily: "Jost", fontSize: 13, color: "#8C7B6E" }}>No matches for "{query.trim()}".</p>
          }
          <div style={{ marginTop: 22, display: suggestions.length > 0 ? "none" : "block" }}>
            <p style={{ fontFamily: "Jost", fontSize: 11, fontWeight: 600, letterSpacing: "0.13em", color: "#8C7B6E", marginBottom: 12 }}>POPULAR SEARCHES</p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["Kurta", "T-Shirt", "Dhoti", "Cotton", "Linen", "White"].map(t => (
                <button key={t} type="button" onClick={() => quickPick(t)} style={{
                  background: "#F7F3EE", border: "1px solid #EDE8E0", borderRadius: 20,
                  fontFamily: "Jost", fontSize: 13, color: "#1A1008",
                  padding: "8px 16px", cursor: "pointer",
                }}>{t}</button>
              ))}
            </div>
          </div>
        </form>
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════ */
/* STICKY ADD-TO-CART (used inside product detail on mobile)           */
/* ═══════════════════════════════════════════════════════════════════ */
function StickyAddToCart({ price, originalPrice, onAdd, onBuyNow, disabled, isAdded }) {
  return (
    <div className="sticky-bottom-cta">
      <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", minWidth: 80, paddingLeft: 4 }}>
        <span style={{ fontFamily: "Cormorant Garamond, serif", fontSize: 19, fontWeight: 500, color: "#1A1008", lineHeight: 1 }}>₹{price.toLocaleString("en-IN")}</span>
        {originalPrice && originalPrice > price && (
          <span style={{ fontFamily: "Jost", fontSize: 11, color: "#B8A99A", textDecoration: "line-through" }}>₹{originalPrice.toLocaleString("en-IN")}</span>
        )}
      </div>
      <button
        onClick={onAdd}
        disabled={disabled}
        style={{
          flex: 1,
          background: isAdded ? "#2D5A1B" : disabled ? "#B8A99A" : "#1A1008",
          color: "#FAF9F7",
          border: "none",
          fontFamily: "Jost",
          fontSize: 12,
          fontWeight: 600,
          letterSpacing: "0.14em",
          borderRadius: 8,
          cursor: disabled ? "not-allowed" : "pointer",
          padding: "0 16px",
          minHeight: 50,
          transition: "background 0.25s",
        }}
      >
        {isAdded ? "✓ ADDED" : "ADD TO BAG"}
      </button>
    </div>
  );
}

/* ─── Make available globally ───────────────────────────────────── */
Object.assign(window, {
  MobileBottomNav, MobileSearchDrawer, StickyAddToCart,
});

})();
  </script>
  <script type="text/babel">
;(function(){
// app.jsx — Root app: cart state (persistent), router, context providers
const { useState, useEffect, useCallback } = React;
const {
  CartContext, AppContext,
  HomePage, ListingPage, DetailPage, CartPage, CheckoutPage, AboutPage, ContactPage,
  LoginPage, SignupPage, ForgotPasswordPage,
  AccountPage, OrdersPage, AddressesPage, ProfilePage,
  MobileBottomNav,
} = window;

/* ─── Cart helpers ──────────────────────────────────────────────── */
function makeKey(item) {
  return `${item.id}__${item.color}__${item.size}`;
}

/* ─── App ───────────────────────────────────────────────────────── */
function App() {
  /* ── Routing ──
     Real paths, not hashes: "/product/linen-veshti" rather than
     "#/detail?productId=<uuid>". Needs the SPA rewrite in vercel.json,
     which sends every non-/api path to this file.

     Without history integration the browser back button leaves the site
     entirely — a shopper on a product who presses back expects the
     listing, not to be thrown out of the store. */
  const pathToRoute = (pathname, search) => {
    const parts = pathname.replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
    const params = {};
    new URLSearchParams(search || "").forEach((v, k) => { params[k] = v; });

    if (!parts.length) return { page: "home", ...params };

    if (parts[0] === "product" && parts[1]) {
      /* Slug is the public handle; resolve to the id the app works with.
         Falls back to treating it as an id for links shared before a
         product was renamed. */
      const slug = decodeURIComponent(parts[1]);
      const hit  = (window.PRODUCTS || []).find(p => p.slug === slug || p.id === slug);
      return { page: "detail", productId: hit ? hit.id : slug, ...params };
    }
    if (parts[0] === "shop") return { page: "listing", ...params };
    return { page: parts[0], ...params };
  };

  const routeToPath = (page, params = {}) => {
    const rest = { ...params };
    let path;

    if (page === "detail") {
      const p = (window.PRODUCTS || []).find(x => x.id === params.productId);
      path = `/product/${encodeURIComponent(p?.slug || params.productId || "")}`;
      delete rest.productId;
    } else if (page === "listing") {
      path = "/shop";
    } else if (page === "home") {
      path = "/";
    } else {
      path = `/${page}`;
    }

    const qs = new URLSearchParams(
      Object.entries(rest).filter(([, v]) => v !== undefined && v !== null && v !== "")
    ).toString();
    return qs ? `${path}?${qs}` : path;
  };

  const [route, setRoute] = useState(() => {
    /* file:// and other non-http origins have no meaningful path — the
       pathname would be the folder on disk. Start at home there. */
    if (!/^https?:$/.test(window.location.protocol)) return { page: "home" };
    return pathToRoute(window.location.pathname, window.location.search);
  });

  const navigate = useCallback((page, params = {}) => {
    const url = routeToPath(page, params);
    /* Pushing to history is what gives us a working back button — but it
       must never be able to break navigation itself. Browsers reject
       pushState on file:// origins, and a throw here would stop the
       route from changing at all. */
    try {
      if (url !== window.location.pathname + window.location.search) {
        window.history.pushState(null, "", url);
      }
    } catch (e) {
      /* No history integration available; in-app navigation still works. */
    }
    setRoute({ page, ...params });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  /* Back / forward, including the Android hardware back key. */
  useEffect(() => {
    const onPop = () => {
      setRoute(pathToRoute(window.location.pathname, window.location.search));
      window.scrollTo({ top: 0, behavior: "auto" });
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  /* ── Cart (persistent across refreshes and devices) ── */
  const [cart,      setCart]      = useState(() => window.cartStore.loadLocal());
  const [cartReady, setCartReady] = useState(false);
  const [authVer,   setAuthVer]   = useState(0);   // increments on login/logout

  /* Expose a global notifier so login/signup/logout can refresh cart */
  useEffect(() => {
    window.notifyAuthChange = () => setAuthVer(v => v + 1);
    return () => { delete window.notifyAuthChange; };
  }, []);

  /* Load cart on mount AND whenever auth state changes (login/logout) */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setCartReady(false);
      const local = window.cartStore.loadLocal();
      let merged = local;
      if (window.auth?.current) {
        const remote = await window.cartStore.loadRemote();
        merged = window.cartStore.mergeCarts(local, remote);
        if (!cancelled) await window.cartStore.saveRemote(merged);
      }
      if (cancelled) return;
      setCart(merged);
      window.cartStore.saveLocal(merged);
      setCartReady(true);
    })();
    return () => { cancelled = true; };
  }, [authVer]);

  /* Save cart on every change (debounced for DB) */
  useEffect(() => {
    if (!cartReady) return;
    window.cartStore.saveLocal(cart);
    if (window.auth?.current) {
      const t = setTimeout(() => window.cartStore.saveRemote(cart), 400);
      return () => clearTimeout(t);
    }
  }, [cart, cartReady]);

  const addToCart = useCallback((item) => {
    const key = makeKey(item);
    setCart(prev => {
      const existing = prev.find(i => i.cartKey === key);
      if (existing) {
        return prev.map(i =>
          i.cartKey === key
            ? { ...i, quantity: Math.min(i.quantity + item.quantity, 10) }
            : i
        );
      }
      return [...prev, { ...item, cartKey: key }];
    });
  }, []);

  const removeFromCart = useCallback((cartKey) => {
    setCart(prev => prev.filter(i => i.cartKey !== cartKey));
  }, []);

  const updateQuantity = useCallback((cartKey, qty) => {
    if (qty < 1) { removeFromCart(cartKey); return; }
    setCart(prev => prev.map(i => i.cartKey === cartKey ? { ...i, quantity: Math.min(qty, 10) } : i));
  }, [removeFromCart]);

  const clearCart = useCallback(() => {
    setCart([]);
    window.cartStore.clearAll();
  }, []);

  const cartTotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
  const cartCount = cart.reduce((sum, i) => sum + i.quantity, 0);

  /* ── Contexts ── */
  const cartCtx = { cart, cartTotal, cartCount, addToCart, removeFromCart, updateQuantity, clearCart };
  const appCtx  = { route, navigate };

  /* ── Render current page ── */
  function renderPage() {
    /* Account routes require login — redirect to /login if not authenticated */
    const accountRoutes = ["account", "orders", "addresses", "profile"];
    if (accountRoutes.includes(route.page) && !window.auth?.current) {
      return <LoginPage />;
    }

    switch (route.page) {
      case "home":      return <HomePage />;
      case "listing":   return <ListingPage key={route.listFilter + (route.searchQuery||"")} />;
      case "detail":    return <DetailPage  key={route.productId} />;
      case "cart":      return <CartPage />;
      case "checkout":  return <CheckoutPage />;
      case "about":     return <AboutPage />;
      case "contact":   return <ContactPage />;
      case "login":     return <LoginPage />;
      case "signup":    return <SignupPage />;
      case "forgot":    return <ForgotPasswordPage />;
      case "account":   return <AccountPage />;
      case "orders":    return <OrdersPage />;
      case "addresses": return <AddressesPage />;
      case "profile":   return <ProfilePage />;
      default:          return <HomePage />;
    }
  }

  return (
    <CartContext.Provider value={cartCtx}>
      <AppContext.Provider value={appCtx}>
        {renderPage()}
        {MobileBottomNav ? <MobileBottomNav /> : null}
      </AppContext.Provider>
    </CartContext.Provider>
  );
}

/* Load live products from Supabase, THEN mount React.
   Hard timeout: mount no matter what after 5 seconds.
   Falls back to an empty product list if the DB is unreachable. */
function setLoaderStatus(msg, color) {
  const status = document.getElementById("kanka-loader-status");
  if (status) {
    status.textContent = msg;
    if (color) status.style.color = color;
  }
}

let mounted = false;
function mountKanka() {
  if (mounted) return;
  mounted = true;
  const loader = document.getElementById("kanka-loader");
  try {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  } catch (e) {
    console.error("[Kanka] Render error:", e);
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;text-align:center;font-family:Jost,sans-serif;color:#C0392B">' +
      'Something went wrong. Please refresh the page.<br><br>' +
      '<small>' + e.message + '</small></div>';
  }
  /* Hold until the letter stagger and rule finish, then lift the whole
     panel upward to reveal the page. */
  if (loader) {
    setTimeout(() => {
      loader.style.transform = "translateY(-100%)";
      setTimeout(() => loader.remove(), 800);
    }, 1400);
  }
}

/* Hard timeout: mount within 5s even if DB doesn't respond */
const hardTimeout = setTimeout(() => {
  console.warn("[Kanka] Hard timeout — mounting with fallback data");
  setLoaderStatus("Loading…", "#C5A468");
  mountKanka();
}, 5000);

setLoaderStatus("Loading products…");
window.loadKankaData()
  .then(() => {
    clearTimeout(hardTimeout);
    setLoaderStatus("Almost ready…");
    mountKanka();
  })
  .catch((err) => {
    clearTimeout(hardTimeout);
    console.error("[Kanka] DB load failed:", err.message);
    setLoaderStatus("Database unreachable. Loading site…", "#C0392B");
    setTimeout(mountKanka, 800);
  });

})();
  </script>
