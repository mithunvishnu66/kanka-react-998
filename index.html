<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanka Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Jost', sans-serif; color: #1A1008; background: #ECE5DB; -webkit-font-smoothing: antialiased; }
  button { cursor: pointer; }
  input { font-family: 'Jost', sans-serif; }
  input::placeholder { color: #B3A492; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: #D8CDBD; border-radius: 8px; }
  ::selection { background: #C5A468; color: #1A1008; }

  @keyframes kkFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes kkSlide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes kkBackdrop { from { opacity: 0; } to { opacity: 1; } }
  @keyframes kkBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  .fade { animation: kkFade 0.38s cubic-bezier(0.22,1,0.36,1) both; }
  .slide { animation: kkSlide 0.34s cubic-bezier(0.22,1,0.36,1) both; }
  .backdrop { animation: kkBackdrop 0.22s ease both; }

  /* LOGIN */
  #login { display: flex; min-height: 100vh; background: #1A1008; }
  .login-brand { width: 46%; background: #1A1008; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 52px; }
  .login-brand::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 0% 0%, rgba(197,164,104,0.14), transparent 55%); }
  .login-form-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #F7F3EE; padding: 28px; }
  .login-form { width: 100%; max-width: 392px; }

  /* APP */
  #app { display: flex; min-height: 100vh; }
  .sidebar { width: 236px; flex-shrink: 0; background: #1A1008; min-height: 100vh; padding: 30px 0 24px; position: sticky; top: 0; display: flex; flex-direction: column; transition: transform 0.32s cubic-bezier(0.22,1,0.36,1); }
  .main { flex: 1; min-width: 0; padding: 28px 36px; display: flex; flex-direction: column; }

  .nav-btn { display: flex; align-items: center; gap: 12px; width: calc(100% - 16px); margin: 1px 8px; background: transparent; border: none; font-family: 'Jost', sans-serif; font-size: 13.5px; font-weight: 400; color: rgba(250,249,247,0.6); padding: 11px 14px; border-radius: 9px; transition: color 0.15s, background 0.15s; text-align: left; }
  .nav-btn:hover { color: #FAF9F7; }
  .nav-btn.active { background: rgba(197,164,104,0.13); color: #FAF9F7; font-weight: 600; }
  .nav-btn.active .nav-icon { color: #C5A468; }
  .nav-icon { color: rgba(250,249,247,0.55); display: flex; align-items: center; flex-shrink: 0; }

  .stat-card { background: #FBF8F3; border: 1px solid #EAE1D4; border-radius: 14px; padding: 22px 22px 20px; position: relative; overflow: hidden; }
  .stat-bar { position: absolute; top: 0; left: 0; width: 100%; height: 3px; }

  .filter-btn { background: #FBF8F3; color: #6B5744; border: 1px solid #E2D9CC; border-radius: 9px; padding: 8px 15px; font-family: 'Jost', sans-serif; font-size: 12.5px; font-weight: 500; }
  .filter-btn.active { background: #1A1008; color: #FAF9F7; border-color: #1A1008; }
  .filter-btn:hover:not(.active) { border-color: #C5A468; color: #1A1008; }

  .table-wrap { background: #FBF8F3; border: 1px solid #EAE1D4; border-radius: 14px; overflow: hidden; }
  .table-head { display: flex; align-items: center; gap: 16px; padding: 13px 22px; background: #F2EBE0; border-bottom: 1px solid #EAE1D4; }
  .th { font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: #9A8978; }
  .table-row { display: flex; align-items: center; gap: 16px; padding: 16px 22px; border-bottom: 1px solid #EFE8DD; cursor: pointer; transition: background 0.12s; }
  .table-row:last-child { border-bottom: none; }
  .table-row:hover { background: #F4EEE4; }

  .prod-card { background: #FBF8F3; border: 1px solid #EAE1D4; border-radius: 14px; overflow: hidden; transition: border-color 0.15s; }
  .prod-card:hover { border-color: #D8CDBD; }

  /* PANEL */
  .panel-backdrop { position: fixed; inset: 0; background: rgba(26,16,8,0.42); z-index: 70; }
  .panel { position: fixed; top: 0; right: 0; height: 100vh; width: 436px; background: #F7F3EE; z-index: 75; overflow-y: auto; box-shadow: -30px 0 80px rgba(26,16,8,0.18); }

  /* MOBILE */
  .hamb { display: none; width: 42px; height: 42px; align-items: center; justify-content: center; background: #FBF8F3; border: 1px solid #E2D9CC; border-radius: 10px; font-size: 17px; color: #1A1008; flex-shrink: 0; }
  @media (max-width: 900px) {
    .sidebar { position: fixed; z-index: 60; top: 0; left: 0; height: 100vh; transform: translateX(-100%); }
    .sidebar.open { transform: none; box-shadow: 30px 0 80px rgba(0,0,0,0.4); }
    .hamb { display: flex; }
    .main { padding: 18px; }
    .topsearch { display: none !important; }
    .stat-grid { grid-template-columns: 1fr 1fr !important; }
    .prod-grid { grid-template-columns: 1fr 1fr !important; }
    .dash-cols { grid-template-columns: 1fr !important; }
    .panel { width: 100% !important; }
    .acct-pill { display: none !important; }
    .login-brand { display: none; }
    .hide-mobile { display: none !important; }
  }
  @media (max-width: 560px) {
    .prod-grid { grid-template-columns: 1fr !important; }
  }

  /* UTILS */
  .mono-num { font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #1A1008; }
  .badge { font-family: 'Jost', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; display: inline-block; white-space: nowrap; }
  .chart-bar { transform-origin: bottom; animation: kkBar 0.7s cubic-bezier(0.22,1,0.36,1) both; }

  /* FORM FIELDS (product editor) */
  .f-label { font-family:'Jost'; font-size:11px; font-weight:600; letter-spacing:0.1em; color:#6B5744; display:block; margin-bottom:7px; }
  .f-input, .f-select, .f-textarea {
    width:100%; font-family:'Jost'; font-size:14px; color:#1A1008; background:#FBF8F3;
    border:1px solid #E2D9CC; border-radius:8px; padding:10px 12px; outline:none; transition:border-color .12s;
  }
  .f-input:focus, .f-select:focus, .f-textarea:focus { border-color:#C5A468; }
  .f-textarea { resize:vertical; min-height:70px; line-height:1.5; }
  .f-row { margin-bottom:18px; }
  .f-hint { font-family:'Jost'; font-size:11px; color:#A89684; margin-top:6px; }
  .f-err { font-family:'Jost'; font-size:12.5px; color:#B23A2A; margin-top:8px; }
  .f-toggle { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .f-switch { width:38px; height:22px; border-radius:999px; background:#E2D9CC; position:relative; transition:background .15s; flex-shrink:0; }
  .f-switch::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#FBF8F3; transition:transform .15s; }
  .f-switch.on { background:#1A1008; }
  .f-switch.on::after { transform:translateX(16px); background:#C5A468; }
  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-family:'Jost'; font-size:12px; font-weight:500; color:#6B5744; background:#FBF8F3; border:1px solid #E2D9CC; border-radius:999px; padding:7px 13px; cursor:pointer; user-select:none; }
  .chip.on { background:#1A1008; color:#FAF9F7; border-color:#1A1008; }
  .color-row, .img-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .icon-btn { width:32px; height:32px; flex-shrink:0; border-radius:7px; border:1px solid #E2D9CC; background:#FBF8F3; color:#8C7B6E; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .icon-btn:hover { border-color:#C5A468; color:#1A1008; }
  .add-link { font-family:'Jost'; font-size:12.5px; font-weight:600; color:#8C7456; letter-spacing:0.04em; display:inline-flex; align-items:center; gap:6px; }
  .img-thumb { width:56px; height:66px; border-radius:7px; object-fit:cover; background:#E2D9CC; flex-shrink:0; }
  .variant-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:9px; }
  .variant-cell { background:#FBF8F3; border:1px solid #E2D9CC; border-radius:8px; padding:8px; }
  .variant-cell label { font-family:'Jost'; font-size:9.5px; font-weight:600; color:#9A8978; display:block; margin-bottom:5px; letter-spacing:0.04em; }
  .variant-cell input { width:100%; border:none; background:transparent; font-family:'Jost'; font-size:14px; color:#1A1008; outline:none; }
  .spinner { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.35); border-top-color:#FAF9F7; display:inline-block; animation:kkSpin .7s linear infinite; }
  @keyframes kkSpin { to { transform:rotate(360deg); } }
  .save-bar { position:sticky; bottom:0; background:#F7F3EE; border-top:1px solid #EAE1D4; padding:16px 28px; display:flex; gap:10px; }

  /* CATEGORY DROPDOWN (custom listbox — a native <select> can't style its options) */
  .kk-select { position:relative; }
  .kk-select-trigger {
    width:100%; display:flex; align-items:center; gap:11px;
    background:#FBF8F3; border:1px solid #E2D9CC; border-radius:8px;
    padding:0 12px; height:46px;
    font-family:'Jost', sans-serif; font-size:14px; color:#1A1008; text-align:left;
    transition:border-color .15s, box-shadow .15s;
  }
  .kk-select-trigger:hover { border-color:#D8CDBD; }
  .kk-select-trigger:focus-visible { outline:none; border-color:#C5A468; box-shadow:0 0 0 3px rgba(197,164,104,0.18); }
  .kk-select.open .kk-select-trigger { border-color:#C5A468; box-shadow:0 0 0 3px rgba(197,164,104,0.18); }
  .kk-select-icon { display:flex; color:#8C7456; flex-shrink:0; }
  .kk-select-value { flex:1; min-width:0; }
  .kk-select-value.placeholder { color:#B3A492; }
  .kk-select-chev { display:flex; color:#A89684; flex-shrink:0; transition:transform .2s cubic-bezier(0.22,1,0.36,1); }
  .kk-select.open .kk-select-chev { transform:rotate(180deg); }

  .kk-select-menu {
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20;
    background:#FBF8F3; border:1px solid #E2D9CC; border-radius:10px;
    box-shadow:0 18px 44px rgba(26,16,8,0.16); padding:5px; display:none;
  }
  .kk-select.open .kk-select-menu { display:block; animation:kkPop .16s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes kkPop { from { opacity:0; transform:translateY(-5px) scale(0.985); } to { opacity:1; transform:none; } }

  .kk-option {
    width:100%; display:flex; align-items:center; gap:11px;
    background:transparent; border:none; border-radius:7px;
    padding:0 11px; height:44px;
    font-family:'Jost', sans-serif; font-size:14px; color:#3F3428; text-align:left;
    transition:background .12s, color .12s;
  }
  .kk-option:hover, .kk-option.active { background:#F2EBE0; color:#1A1008; }
  .kk-option[aria-selected="true"] { color:#1A1008; font-weight:600; }
  .kk-option-icon { display:flex; color:#A89684; flex-shrink:0; transition:color .12s; }
  .kk-option:hover .kk-option-icon, .kk-option.active .kk-option-icon,
  .kk-option[aria-selected="true"] .kk-option-icon { color:#8C7456; }
  .kk-option-label { flex:1; min-width:0; }
  .kk-option-tick { display:flex; color:#C5A468; opacity:0; flex-shrink:0; }
  .kk-option[aria-selected="true"] .kk-option-tick { opacity:1; }

  @media (prefers-reduced-motion: reduce) {
    .kk-select-chev { transition:none; }
    .kk-select.open .kk-select-menu { animation:none; }
  }
</style>
</head>

<script>
// ══════════════════════════════════════════
//  SUPABASE CONFIG + REST HELPERS
// ══════════════════════════════════════════
const SUPABASE_URL = "https://eyjpkpvhnepcwuttvynt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5anBrcHZobmVwY3d1dHR2eW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjEzODMsImV4cCI6MjA5NjYzNzM4M30.dRWtS897sZYLyJH8hNYp4H97r1le4lHJ1AJRFV93tPI";
const IMAGE_BUCKET = "product-images";
const ADMIN_AUTH_KEY = "kanka_admin_session"; // deliberately separate from the storefront's "kanka_session"

function _getAdminSession() {
  try {
    const s = JSON.parse(localStorage.getItem(ADMIN_AUTH_KEY) || "null");
    if (!s?.access_token || !s?.user) return null;
    const payload = JSON.parse(atob(s.access_token.split('.')[1]));
    if (payload.exp && payload.exp * 1000 < Date.now()) {
      /* Expired — but keep it if there's a refresh token to trade in.
         Boot calls adminAuth.refresh(); only a failed refresh logs out. */
      if (!s.refresh_token) { localStorage.removeItem(ADMIN_AUTH_KEY); return null; }
      s._expired = true;
    }
    return s;
  } catch { return null; }
}
function _saveAdminSession(s) {
  if (s) localStorage.setItem(ADMIN_AUTH_KEY, JSON.stringify(s));
  else localStorage.removeItem(ADMIN_AUTH_KEY);
}

const adminAuth = {
  current: _getAdminSession(),

  async login(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || "Login failed.");

    // Must actually be an admin — a valid customer login is not enough.
    const profRes = await fetch(`${SUPABASE_URL}/rest/v1/customers?id=eq.${data.user.id}&select=is_admin,full_name`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${data.access_token}` },
    });
    const profRows = await profRes.json();
    if (!profRes.ok || !profRows?.[0]?.is_admin) {
      throw new Error("This account doesn't have studio access.");
    }

    const session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user, full_name: profRows[0].full_name };
    _saveAdminSession(session);
    this.current = session;
    return session;
  },

  /* Access tokens expire after ~1 hour. Exchange the refresh token for a
     fresh pair rather than dumping the admin back at the login screen
     mid-edit. Returns false if the refresh token is also dead, in which
     case the session is cleared and a real re-login is required. */
  async refresh() {
    const s = this.current;
    if (!s?.refresh_token) return false;
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: s.refresh_token }),
      });
      const data = await res.json();
      if (!res.ok || !data.access_token) { _saveAdminSession(null); this.current = null; return false; }
      const next = { ...s, access_token: data.access_token, refresh_token: data.refresh_token || s.refresh_token, user: data.user || s.user };
      _saveAdminSession(next);
      this.current = next;
      return true;
    } catch {
      return false;
    }
  },

  async logout() {
    const s = this.current;
    if (s?.access_token) {
      try { await fetch(`${SUPABASE_URL}/auth/v1/logout`, { method:"POST", headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${s.access_token}` } }); } catch {}
    }
    _saveAdminSession(null);
    this.current = null;
  },
};

/* Thin PostgREST client, authenticated as the logged-in admin so RLS's
   is_admin() check applies. Mirrors the pattern already used in kanka.js
   server-side, just from the browser with the user's own token. */
async function sbFetch(path, { method = "GET", body, prefer, _retried = false } = {}) {
  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: `Bearer ${adminAuth.current?.access_token || SUPABASE_KEY}`,
    "Content-Type": "application/json",
  };
  if (prefer) headers.Prefer = prefer;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method, headers, body: body===undefined?undefined:JSON.stringify(body) });

  /* Expired access token — refresh once and replay the request, so an
     admin mid-edit never loses work to a silent hourly timeout. */
  if (res.status === 401 && !_retried && adminAuth.current?.refresh_token) {
    if (await adminAuth.refresh()) {
      return sbFetch(path, { method, body, prefer, _retried: true });
    }
  }

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.message || `Request failed (${res.status})`);
  return data;
}

async function uploadProductImage(file, slug) {
  const clean = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${slug}/${Date.now()}-${Math.random().toString(36).slice(2,7)}-${clean}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${IMAGE_BUCKET}/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${adminAuth.current.access_token}`,
      "Content-Type": file.type || "application/octet-stream",
    },
    body: file,
  });
  if (!res.ok) throw new Error((await res.json())?.message || "Image upload failed.");
  return { url: `${SUPABASE_URL}/storage/v1/object/public/${IMAGE_BUCKET}/${path}`, path };
}

async function deleteProductImageFile(path) {
  if (!path) return;
  try {
    await fetch(`${SUPABASE_URL}/storage/v1/object/${IMAGE_BUCKET}/${path}`, {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${adminAuth.current.access_token}` },
    });
  } catch {}
}

function slugify(s) {
  return String(s || "").toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80);
}

async function loadProducts() {
  productsLoadError = null;
  try {
    const query =
        "select=id,slug,name,description,details,price,original_price,category,tags,is_active,"
      + "product_images(id,url,sort_order),"
      + "product_colors(id,name,hex,sort_order),"
      + "product_variants(id,color,size,stock,sku)"
      + "&order=created_at.desc";
    const rows = await sbFetch(`products?${query}`);
    PRODUCTS = rows.map(p => {
      const images = (p.product_images||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
      const colors = (p.product_colors||[]).slice().sort((a,b)=>a.sort_order-b.sort_order);
      const variants = p.product_variants || [];
      const sizes = [...new Set(variants.map(v=>v.size))];
      const totalStock = variants.reduce((s,v)=>s+(Number(v.stock)||0), 0);
      return {
        id: p.id, slug: p.slug, name: p.name, description: p.description||"",
        details: p.details||[], price: Number(p.price), originalPrice: p.original_price?Number(p.original_price):null,
        category: p.category, tags: p.tags||[], isActive: p.is_active,
        images, colors, sizes, variants, totalStock,
      };
    });
    productsLoaded = true;
  } catch (err) {
    productsLoadError = err.message || "Couldn't load products.";
    productsLoaded = true;
  }
}

const el = (tag, attrs={}, ...children) => {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v]) => {
    if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v);
  });
  children.forEach(c => {
    if (c == null) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
};

  filterRow.appendChild(filterLeft);

    let bLabel="Active",bC="#3B6B2A",bBg="rgba(231,239,223,0.9)";
    if(draft){bLabel="Draft";bC="#6B5744";bBg="rgba(247,243,238,0.92)";}
    else if(sold){bLabel="Sold out";bC="#B23A2A";bBg="rgba(246,228,224,0.95)";}
    else if(low){bLabel="Low stock";bC="#9A7B2E";bBg="rgba(244,236,215,0.95)";}
    const img = p.images[0]?.url;
    const thumbStyle = img ? `background-image:url('${img}');background-size:cover;background-position:center;` : `background:linear-gradient(150deg,#D8CDBD,#C2AE93);`;
    const card = el("div",{onclick:()=>openProductEditor(p)}); card.className = "prod-card"; card.style.cursor="pointer";
    card.innerHTML = `
      <div style="height:168px;${thumbStyle}position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:14px;">
        <span style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:${bC};background:${bBg};backdrop-filter:blur(4px);">${bLabel}</span>
        <button class="del-prod-btn" style="width:28px;height:28px;border-radius:50%;border:none;background:rgba(26,16,8,0.55);color:#FAF9F7;font-size:13px;backdrop-filter:blur(4px);">✕</button>
      </div>
      <div style="padding:16px 16px 18px;">
        <p style="font-family:'Jost';font-size:9.5px;font-weight:600;letter-spacing:0.13em;color:#A89684;margin-bottom:6px;">${(CATEGORY_LABELS[p.category]||p.category||"").toUpperCase()}</p>
        <p style="font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:500;color:#1A1008;line-height:1.05;margin-bottom:12px;">${p.name}</p>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-family:'Jost';font-size:15px;font-weight:500;color:#1A1008;">${money(p.price)}</span>
          <span style="font-family:'Jost';font-size:12px;color:${sold||draft?"#A89684":low?"#9A7B2E":"#6B5744"};">${draft?"Unpublished":sold?"0 in stock":p.totalStock+" in stock"}</span>
        </div>
      </div>`;
    card.querySelector(".del-prod-btn").addEventListener("click", (e) => { e.stopPropagation(); deleteProduct(p); });
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}

// ── DELETE PRODUCT ──
async function deleteProduct(p) {
  if (!confirm(`Delete "${p.name}"? This removes its images, colours and stock. This can't be undone.`)) return;
  try {
    for (const img of p.images) {
      const path = img.url.split(`/public/${IMAGE_BUCKET}/`)[1];
      if (path) await deleteProductImageFile(path);
    }
    await sbFetch(`products?id=eq.${p.id}`, { method:"DELETE" });
    await loadProducts();
    const scr = $("#screen-products"); scr.innerHTML=""; renderScreen("products", scr);
    render();
  } catch (err) {
    alert("Couldn't delete product: " + err.message);
  }
}

// ── PRODUCT EDITOR PANEL ──
function openProductEditor(p) {
  state.panelType = "product";
  const draft = p ? {
    id: p.id, isNew: false,
    name: p.name, slug: p.slug, slugManuallyEdited: true,
    category: p.category || DEFAULT_CATEGORY,
    price: String(p.price ?? ""), originalPrice: p.originalPrice!=null?String(p.originalPrice):"",
    description: p.description || "",
    details: (p.details||[]).join("\n"),
    tags: (p.tags||[]).join(", "),
    isActive: p.isActive !== false,
    colors: p.colors.length ? p.colors.map(c=>({_cid:c.id||("c"+Math.random()), name:c.name, hex:c.hex})) : [{_cid:"c0", name:"", hex:"#C5A468"}],
    sizes: [...p.sizes],
    images: p.images.map(i=>({id:i.id, url:i.url, path:i.url.split(`/public/${IMAGE_BUCKET}/`)[1]||null, isNew:false})),
    stock: (() => {
      // _cid mirrors the real product_colors.id for existing colours (see .map above),
      // so keying stock by color.id here lines up with draft.colors[i]._cid.
      const m = {};
      p.variants.forEach(v => {
        const c = p.colors.find(c=>c.name===v.color);
        const cid = c ? c.id : v.color;
        m[`${cid}|${v.size}`] = String(v.stock);
      });
      return m;
    })(),
    saving: false, error: null,
  } : {
    id: null, isNew: true,
    name: "", slug: "", slugManuallyEdited: false,
    category: DEFAULT_CATEGORY, price: "", originalPrice: "",
    description: "", details: "", tags: "", isActive: true,
    colors: [{_cid:"c0", name:"", hex:"#C5A468"}],
    sizes: [], images: [], stock: {},
    saving: false, error: null,
  };
  state.editingProduct = draft;

  const panel = $("#panel");
  const backdrop = $("#panel-backdrop");
  panel.style.display = "block";
  backdrop.style.display = "block";
  panel.classList.remove("slide");
  void panel.offsetWidth;
  panel.classList.add("slide");
  renderProductPanel();
}

  renderImageRow();
  renderColorsList();
  renderSizeChips();
  renderVariantGrid();

  $("#img-file-input").addEventListener("change", async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length) return;
    if (!d.slug) { d.error = "Give the product a name first, so images have somewhere to go."; renderProductPanel(); return; }
    const rowEl = $("#img-row");
    for (const file of files) {
      const placeholder = el("div",{class:"img-thumb",style:{display:"flex",alignItems:"center",justifyContent:"center"}}, "…");
      rowEl.insertBefore(placeholder, rowEl.lastElementChild);
      try {
        const { url, path } = await uploadProductImage(file, d.slug);
        d.images.push({ url, path, isNew:true });
      } catch (err) {
        d.error = err.message;
      }
    }
    renderProductPanel();
  });
}

/* Custom category listbox. Selecting deliberately does NOT re-render the whole
   panel — that would blow away scroll position and focus mid-edit. */
let _catOutsideHandler = null;

function wireCategorySelect() {
  const d = state.editingProduct;
  const root    = $("#f-category-select");
  const trigger = $("#f-category-trigger");
  const menu    = $("#f-category-menu");
  if (!root || !trigger || !menu) return;

  const options = [...menu.querySelectorAll(".kk-option")];
  const isOpen  = () => root.classList.contains("open");
  let activeIdx = Math.max(0, CATEGORY_KEYS.indexOf(d.category));

  const setActive = (i) => {
    activeIdx = (i + options.length) % options.length;
    options.forEach((o, n) => o.classList.toggle("active", n === activeIdx));
    options[activeIdx].scrollIntoView({ block: "nearest" });
  };

  const open = () => {
    root.classList.add("open");
    trigger.setAttribute("aria-expanded", "true");
    setActive(Math.max(0, CATEGORY_KEYS.indexOf(d.category)));
  };
  const close = () => {
    root.classList.remove("open");
    trigger.setAttribute("aria-expanded", "false");
    options.forEach(o => o.classList.remove("active"));
  };

  const choose = (key) => {
    d.category = key;
    $("#f-category-icon").innerHTML = CATEGORY_ICONS[key] || "";
    const val = $("#f-category-value");
    val.textContent = CATEGORY_LABELS[key];
    val.classList.remove("placeholder");
    options.forEach(o => o.setAttribute("aria-selected", String(o.dataset.key === key)));
    close();
    trigger.focus();
  };

  trigger.addEventListener("click", e => { e.stopPropagation(); isOpen() ? close() : open(); });

  trigger.addEventListener("keydown", e => {
    if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
      e.preventDefault();
      if (!isOpen()) return open();
      if (e.key === "Enter" || e.key === " ") choose(options[activeIdx].dataset.key);
      else setActive(activeIdx + (e.key === "ArrowDown" ? 1 : -1));
    } else if (e.key === "Escape" && isOpen()) {
      e.preventDefault(); close();
    } else if (e.key === "Tab") {
      close();
    }
  });

  options.forEach((o, i) => {
    o.addEventListener("click", e => { e.stopPropagation(); choose(o.dataset.key); });
    o.addEventListener("mousemove", () => setActive(i));
  });

  menu.addEventListener("click", e => e.stopPropagation());

  /* One outside-click handler total — the panel re-renders often, so the
     previous one is removed before registering a replacement. */
  if (_catOutsideHandler) document.removeEventListener("click", _catOutsideHandler);
  _catOutsideHandler = () => close();
  document.addEventListener("click", _catOutsideHandler);
}

function renderImageRow() {
  const d = state.editingProduct;
  const row = $("#img-row");
  row.innerHTML = "";
  d.images.forEach((img, i) => {
    const wrap = el("div",{style:{position:"relative"}});
    wrap.innerHTML = `<img src="${img.url}" class="img-thumb" />
      <button style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#1A1008;color:#FAF9F7;border:none;font-size:10px;">✕</button>`;
    wrap.querySelector("button").addEventListener("click", async () => {
      if (img.path) await deleteProductImageFile(img.path);
      d.images.splice(i,1);
      renderProductPanel();
    });
    row.appendChild(wrap);
  });
  const addTile = el("button",{class:"icon-btn",style:{width:"56px",height:"66px",fontSize:"20px"},onclick:()=>$("#img-file-input").click()},"＋");
  row.appendChild(addTile);
}

function renderColorsList() {
  const d = state.editingProduct;
  const wrap = $("#colors-list");
  wrap.innerHTML = "";
  d.colors.forEach((c, i) => {
    const row = el("div",{class:"color-row"});
    row.innerHTML = `
      <input type="color" value="${/^#[0-9a-fA-F]{6}$/.test(c.hex)?c.hex:"#C5A468"}" style="width:38px;height:38px;border:1px solid #E2D9CC;border-radius:8px;padding:2px;background:#FBF8F3;flex-shrink:0;" />
      <input type="text" class="f-input" placeholder="Colour name (e.g. Olive)" value="${escAttr(c.name)}" />
      <button class="icon-btn">✕</button>`;
    const [colorInput, nameInput, delBtn] = row.querySelectorAll("input, button");
    colorInput.addEventListener("input", e => { c.hex = e.target.value; });
    nameInput.addEventListener("input", e => { c.name = e.target.value; });
    delBtn.addEventListener("click", () => { d.colors.splice(i,1); if(!d.colors.length) d.colors.push({_cid:"c"+Math.random(),name:"",hex:"#C5A468"}); renderProductPanel(); });
    wrap.appendChild(row);
  });
  $("#add-color-btn").onclick = () => { d.colors.push({_cid:"c"+Math.random()+Date.now(), name:"", hex:"#C5A468"}); renderProductPanel(); };
}

function renderSizeChips() {
  const d = state.editingProduct;
  const wrap = $("#sizes-chip-row");
  wrap.innerHTML = "";
  ALL_SIZES.forEach(sz => {
    const on = d.sizes.includes(sz);
    const chip = el("button",{class:"chip"+(on?" on":""), type:"button", onclick:()=>{
      d.sizes = on ? d.sizes.filter(s=>s!==sz) : [...d.sizes, sz];
      renderProductPanel();
    }}, sz);
    wrap.appendChild(chip);
  });
}

function renderVariantGrid() {
  const d = state.editingProduct;
  const grid = $("#variant-grid");
  grid.innerHTML = "";
  const colors = d.colors.filter(c => c.name.trim());
  if (!colors.length || !d.sizes.length) return;
  colors.forEach(c => {
    d.sizes.forEach(sz => {
      const key = `${c._cid}|${sz}`;
      const cell = el("div",{class:"variant-cell"});
      cell.innerHTML = `<label>${esc(c.name)} · ${sz}</label><input type="number" min="0" step="1" value="${d.stock[key] ?? 0}" />`;
      cell.querySelector("input").addEventListener("input", e => { d.stock[key] = e.target.value; });
      grid.appendChild(cell);
    });
  });
}

function esc(s) { return String(s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

async function saveProductDraft() {
  const d = state.editingProduct;
  d.error = null;

  if (!d.name.trim())            { d.error = "Give the product a name."; renderProductPanel(); return; }
  if (!d.slug.trim())            { d.error = "Give the product a slug."; renderProductPanel(); return; }
  const priceNum = Number(d.price);
  if (!Number.isFinite(priceNum) || priceNum <= 0) { d.error = "Enter a valid price."; renderProductPanel(); return; }
  const colors = d.colors.filter(c => c.name.trim());
  if (!colors.length)            { d.error = "Add at least one colour."; renderProductPanel(); return; }
  if (!d.sizes.length)           { d.error = "Select at least one size."; renderProductPanel(); return; }

  d.saving = true; renderProductPanel();

  try {
    const payload = {
      name: d.name.trim(),
      slug: d.slug.trim(),
      category: d.category,
      price: priceNum,
      original_price: d.originalPrice ? Number(d.originalPrice) : null,
      description: d.description.trim() || null,
      details: d.details.split("\n").map(s=>s.trim()).filter(Boolean),
      tags: d.tags.split(",").map(s=>s.trim()).filter(Boolean),
      is_active: d.isActive,
    };

    let productId = d.id;
    if (d.isNew) {
      const [row] = await sbFetch("products", { method:"POST", body:[payload], prefer:"return=representation" });
      productId = row.id;
    } else {
      await sbFetch(`products?id=eq.${productId}`, { method:"PATCH", body:payload, prefer:"return=minimal" });
      // Replace child rows wholesale — simplest correct approach for a single-admin panel.
      await sbFetch(`product_images?product_id=eq.${productId}`, { method:"DELETE" });
      await sbFetch(`product_colors?product_id=eq.${productId}`, { method:"DELETE" });
      await sbFetch(`product_variants?product_id=eq.${productId}`, { method:"DELETE" });
    }

    if (d.images.length) {
      await sbFetch("product_images", { method:"POST", prefer:"return=minimal",
        body: d.images.map((img,i) => ({ product_id: productId, url: img.url, sort_order: i })) });
    }

    const colorRows = await sbFetch("product_colors", { method:"POST", prefer:"return=representation",
      body: colors.map((c,i) => ({ product_id: productId, name: c.name.trim(), hex: c.hex, sort_order: i })) });
    const cidToRealId = {};
    colors.forEach((c, i) => { cidToRealId[c._cid] = colorRows[i].id; });

    const slugUpper = d.slug.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16);
    const variantRows = [];
    colors.forEach(c => {
      const colorCode = c.name.trim().slice(0,3).toUpperCase().replace(/[^A-Z]/g,"") || "COL";
      d.sizes.forEach(sz => {
        const stock = Math.max(0, parseInt(d.stock[`${c._cid}|${sz}`], 10) || 0);
        variantRows.push({ product_id: productId, color: c.name.trim(), size: sz, stock, sku: `${slugUpper}-${colorCode}-${sz}` });
      });
    });
    await sbFetch("product_variants", { method:"POST", prefer:"return=minimal", body: variantRows });

    await loadProducts();
    closePanel();
    const scr = $("#screen-products"); scr.innerHTML=""; renderScreen("products", scr);
    render();
  } catch (err) {
    d.saving = false;
    d.error = err.message?.includes("duplicate key") ? "That slug is already in use — try a different one." : (err.message || "Couldn't save this product.");
    renderProductPanel();
  }
}

// ── ORDER PANEL ──
function openOrder(id) {
  state.selectedOrder = id;
  const o = ORDERS.find(x=>x.id===id);
  if (!o) return;
  const panel = $("#panel");
  const backdrop = $("#panel-backdrop");
  panel.style.display = "block";
  backdrop.style.display = "block";
  panel.classList.remove("slide");
  void panel.offsetWidth;
  panel.classList.add("slide");
  renderPanel(o);
}

function closeOrder() { closePanel(); }

function closePanel() {
  $("#panel").style.display = "none";
  $("#panel-backdrop").style.display = "none";
  state.selectedOrder = null;
  state.editingProduct = null;
  state.panelType = null;
}

function renderPanel(o) {
  const panel = $("#panel");
  const subtotal = o.items.reduce((s,it)=>s+it[2],0);
  const cancelled = o.status==="cancelled";
  const curIdx = FLOW.indexOf(o.status);

  panel.innerHTML = `
    <div style="padding:26px 28px 22px;background:#1A1008;color:#FAF9F7;position:sticky;top:0;z-index:2;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div>
          <p style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.16em;color:#C5A468;margin-bottom:8px;">ORDER DETAIL</p>
          <h2 style="font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:#FAF9F7;line-height:1;">${o.number}</h2>
          <p style="font-family:'Jost';font-size:12.5px;color:rgba(250,249,247,0.6);margin-top:7px;">Placed ${o.date}</p>
        </div>
        <button id="close-panel" style="width:36px;height:36px;border-radius:50%;background:rgba(250,249,247,0.1);border:none;color:#FAF9F7;font-size:16px;cursor:pointer;">✕</button>
      </div>
    </div>
    <div style="padding:24px 28px 40px;">
      <p style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.12em;color:#9A8978;margin-bottom:14px;">FULFILLMENT</p>
      <div style="display:flex;align-items:flex-start;margin-bottom:26px;">
        ${FLOW.map((s,i) => {
          const done=!cancelled&&i<=curIdx, current=!cancelled&&i===curIdx;
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;position:relative;">
            <div style="position:absolute;top:9px;left:-50%;width:100%;height:2px;background:${!cancelled&&i<=curIdx&&i>0?"#1A1008":"#E2D9CC"};"></div>
            <div style="width:20px;height:20px;border-radius:50%;z-index:1;background:${current?"#C5A468":done?"#1A1008":"#E2D9CC"};border:2px solid ${current?"#C5A468":done?"#1A1008":"#E2D9CC"};display:flex;align-items:center;justify-content:center;font-size:10px;color:#FAF9F7;">${done&&!current?"✓":""}</div>
            <span style="font-family:'Jost';font-size:10px;font-weight:500;color:${done?"#1A1008":"#A89684"};margin-top:8px;text-align:center;">${STATUS_META[s].label}</span>
          </div>`;
        }).join("")}
      </div>

      <div style="background:#FBF8F3;border:1px solid #EAE1D4;border-radius:12px;padding:18px 20px;margin-bottom:16px;">
        <p style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.12em;color:#9A8978;margin-bottom:11px;">DELIVER TO</p>
        <p style="font-family:'Jost';font-size:14px;font-weight:600;color:#1A1008;margin-bottom:5px;">${o.name}</p>
        <p style="font-family:'Jost';font-size:13px;color:#6B5744;line-height:1.7;">${o.addr1}<br/>${o.addr2}<br/>${o.phone}</p>
      </div>

      <div style="background:#FBF8F3;border:1px solid #EAE1D4;border-radius:12px;padding:18px 20px;margin-bottom:16px;">
        <p style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.12em;color:#9A8978;margin-bottom:14px;">ITEMS</p>
        ${o.items.map(it => {
          const p = prod(it[0]);
          return `<div style="display:flex;align-items:center;gap:13px;padding:8px 0;border-bottom:1px solid #EFE8DD;">
            <div style="width:42px;height:50px;border-radius:6px;flex-shrink:0;background:${p?p.swatch:"#D8CDBD"};"></div>
            <div style="flex:1;min-width:0;">
              <p style="font-family:'Jost';font-size:13.5px;font-weight:500;color:#1A1008;">${p?p.name:"Item"}</p>
              <p style="font-family:'Jost';font-size:12px;color:#A89684;">${it[1]}</p>
            </div>
            <span style="font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:#1A1008;">${money(it[2])}</span>
          </div>`;
        }).join("")}
        <div style="display:flex;justify-content:space-between;padding-top:14px;"><span style="font-family:'Jost';font-size:13px;color:#6B5744;">Subtotal</span><span style="font-family:'Jost';font-size:13px;color:#1A1008;">${money(subtotal)}</span></div>
        <div style="display:flex;justify-content:space-between;padding-top:8px;"><span style="font-family:'Jost';font-size:13px;color:#6B5744;">Shipping</span><span style="font-family:'Jost';font-size:13px;color:#1A1008;">${o.shipping===0?"Free":money(o.shipping)}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:13px;margin-top:11px;border-top:1px solid #EAE1D4;">
          <span style="font-family:'Jost';font-size:12px;font-weight:600;letter-spacing:0.1em;color:#1A1008;">TOTAL</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#1A1008;">${money(subtotal+o.shipping)}</span>
        </div>
      </div>

      <p style="font-family:'Jost';font-size:10px;font-weight:600;letter-spacing:0.12em;color:#9A8978;margin-bottom:11px;">UPDATE STATUS</p>
      <div id="status-actions" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>`;

  document.getElementById("close-panel").addEventListener("click", closeOrder);

  const actionsWrap = document.getElementById("status-actions");
  [...FLOW,"cancelled"].forEach(s => {
    const active = o.status === s;
    const isCancel = s === "cancelled";
    const btn = el("button", {
      style: {
        background: active ? (isCancel?"#B23A2A":"#1A1008") : "#FBF8F3",
        color: active ? "#FAF9F7" : (isCancel?"#B23A2A":"#6B5744"),
        border: isCancel ? "1px solid #E3C4BC" : "1px solid #E2D9CC",
        borderRadius:"8px", padding:"8px 14px",
        fontFamily:"Jost", fontSize:"12px", fontWeight:"500",
        cursor:"pointer",
      },
      onclick: () => {
        o.status = s;
        renderPanel(o);
        // refresh the active screen
        const scr = $("#screen-"+state.screen);
        scr.innerHTML=""; renderScreen(state.screen, scr);
        // refresh nav badges
        render();
      }
    }, isCancel ? "Cancel" : STATUS_META[s].label);
    actionsWrap.appendChild(btn);
  });
}

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function goTo(screen) {
  state.screen = screen;
  state.search = "";
  state.navOpen = false;
  closeNav();
  render();
}

function closeNav() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("nav-backdrop").style.display = "none";
  state.navOpen = false;
}

// ══════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════
async function attemptLogin() {
  const email = document.getElementById("inp-email").value.trim();
  const pw    = document.getElementById("inp-pw").value;
  const errEl = document.getElementById("login-err");
  const btn   = document.getElementById("btn-login");
  const label = document.getElementById("login-btn-label");
  errEl.style.display = "none";
  if (!email || !pw) { errEl.textContent = "Enter your email and password."; errEl.style.display = "block"; return; }

  btn.disabled = true;
  label.innerHTML = '<span class="spinner"></span>';
  try {
    await adminAuth.login(email, pw);
    await loadProducts();
    goTo("dashboard");
  } catch (err) {
    errEl.textContent = err.message || "Couldn't sign in.";
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    label.textContent = "ENTER STUDIO →";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  // Login
  document.getElementById("btn-login").addEventListener("click", attemptLogin);
  document.getElementById("inp-pw").addEventListener("keydown", e => { if(e.key==="Enter") attemptLogin(); });

  // Logout
  document.getElementById("btn-logout").addEventListener("click", async () => {
    await adminAuth.logout();
    PRODUCTS = []; productsLoaded = false;
    goTo("login");
  });

  // Hamburger
  document.getElementById("btn-hamb").addEventListener("click", () => {
    state.navOpen = !state.navOpen;
    document.getElementById("sidebar").classList.toggle("open", state.navOpen);
    const bd = document.getElementById("nav-backdrop");
    bd.style.display = state.navOpen ? "block" : "none";
    if(state.navOpen){ bd.classList.remove("backdrop"); void bd.offsetWidth; bd.classList.add("backdrop"); }
  });
  document.getElementById("nav-backdrop").addEventListener("click", closeNav);

  // Panel backdrop
  document.getElementById("panel-backdrop").addEventListener("click", closeOrder);

  // Search
  document.getElementById("search-inp").addEventListener("input", e => {
    state.search = e.target.value;
    const scr = $("#screen-"+state.screen);
    scr.innerHTML=""; renderScreen(state.screen, scr);
  });

  // Resume an existing admin session if we still have one, else show login
  if (adminAuth.current) {
    /* Session restored from a previous visit may hold an expired access
       token. Trade the refresh token in before touching the API. */
    let ok = true;
    if (adminAuth.current._expired) ok = await adminAuth.refresh();
    if (!ok) {
      state.screen = "login";
    } else {
      await loadProducts();
      state.screen = productsLoadError ? "login" : "dashboard";
      if (productsLoadError) { await adminAuth.logout(); }
    }
  } else {
    state.screen = "login";
  }
  render();
});
</script>
