function LoginPage() {
  const { navigate } = useApp();
  const [step,    setStep]    = useState("phone"); // "phone" | "otp"
  const [phone,   setPhone]   = useState("");
  const [country, setCountry] = useState("+91");
  const [otp,     setOtp]     = useState(["","","","","",""]);
  const [timer,   setTimer]   = useState(0);
  const [busy,    setBusy]    = useState(false);
  const [err,     setErr]     = useState("");

  /* Countdown timer for resend */
  useEffect(() => {
    if (timer <= 0) return;
    const t = setTimeout(() => setTimer(t2 => t2 - 1), 1000);
    return () => clearTimeout(t);
  }, [timer]);

  /* Send OTP */
  async function sendOTP() {
    setErr("");
    const fullPhone = country + phone.replace(/\D/g,"");
    if (phone.replace(/\D/g,"").length < 7) { setErr("Please enter a valid phone number"); return; }
    setBusy(true);
    try {
      const res = await fetch(`${window.SUPABASE_URL}/auth/v1/otp`, {
        method:"POST",
        headers:{ apikey: window.SUPABASE_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ phone: fullPhone }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.msg || data.error_description || "Failed to send OTP");
      setStep("otp");
      setTimer(30);
    } catch(e) { setErr(e.message); }
    finally { setBusy(false); }
  }

  /* Handle OTP box input */
  function handleOtpInput(i, val) {
    if (!/^\d*$/.test(val)) return;
    const next = [...otp];
    next[i] = val.slice(-1);
    setOtp(next);
    if (val && i < 5) document.getElementById(`otp-${i+1}`)?.focus();
    if (next.every(d => d) && next.join("").length === 6) verifyOTP(next.join(""));
  }

  function handleOtpKey(i, e) {
    if (e.key === "Backspace" && !otp[i] && i > 0) document.getElementById(`otp-${i-1}`)?.focus();
    if (e.key === "Enter" && otp.every(d => d)) verifyOTP(otp.join(""));
  }

  function handleOtpPaste(e) {
    const pasted = e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6);
    if (pasted.length === 6) {
      setOtp(pasted.split(""));
      setTimeout(() => verifyOTP(pasted), 100);
    }
  }

  /* Verify OTP */
  async function verifyOTP(code) {
    setErr(""); setBusy(true);
    const fullPhone = country + phone.replace(/\D/g,"");
    try {
      const res = await fetch(`${window.SUPABASE_URL}/auth/v1/token?grant_type=phone_otp`, {
        method:"POST",
        headers:{ apikey: window.SUPABASE_KEY, "Content-Type":"application/json" },
        body: JSON.stringify({ phone: fullPhone, token: code }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || "Invalid OTP");
      const session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
      localStorage.setItem("kanka_session", JSON.stringify(session));
      window.auth.current = session;
      window.notifyAuthChange?.();
      navigate("account");
    } catch(e) {
      setErr(e.message);
      setOtp(["","","","","",""]);
      document.getElementById("otp-0")?.focus();
    }
    finally { setBusy(false); }
  }

  /* ── STEP 1: Phone Entry ── */
  if (step === "phone") return (
    <AuthCard
      title="Sign In"
      subtitle="Enter your phone number to continue"
    >
      {err && <div style={F.err}>{err}</div>}

      <div style={{ marginBottom:16 }}>
        <label style={F.label}>PHONE NUMBER</label>
        <div style={{ display:"flex", gap:8 }}>
          <select value={country} onChange={e => setCountry(e.target.value)}
            style={{ ...F.input, width:88, paddingLeft:10, paddingRight:4, flexShrink:0, cursor:"pointer" }}>
            <option value="+91">🇮🇳 +91</option>
            <option value="+1">🇺🇸 +1</option>
            <option value="+44">🇬🇧 +44</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+65">🇸🇬 +65</option>
          </select>
          <input type="tel" autoFocus value={phone}
            onChange={e => setPhone(e.target.value)}
            onKeyDown={e => e.key === "Enter" && sendOTP()}
            placeholder="98765 43210"
            style={F.input}
          />
        </div>
      </div>

      <div style={{ background:"#F7F3EE", borderRadius:8, padding:"10px 14px", marginBottom:20 }}>
        <p style={{ fontFamily:"Jost", fontSize:11, color:"#8C7B6E", lineHeight:1.6 }}>
          🔐 Test mode: OTP is always <strong style={{ color:"#1A1008" }}>123456</strong>. No real SMS sent yet.
        </p>
      </div>

      <button onClick={sendOTP} disabled={busy} style={{
        width:"100%", height:52, background: busy ? "#B8A99A" : "#1A1008",
        color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:12,
        fontWeight:600, letterSpacing:"0.15em", borderRadius:8,
        cursor: busy ? "not-allowed" : "pointer", display:"flex",
        alignItems:"center", justifyContent:"center", gap:8,
      }}>
        {busy ? "SENDING…" : <>"SEND OTP" <IconArrowRight size={15}/></>}
      </button>

      <p style={{ fontFamily:"Jost", fontSize:11, color:"#8C7B6E", textAlign:"center", marginTop:20, lineHeight:1.7 }}>
        New or returning customer — same process.<br/>Account created automatically on first login.
      </p>
    </AuthCard>
  );

  /* ── STEP 2: OTP Verification ── */
  return (
    <AuthCard
      title="Enter Code"
      subtitle={`Sent to ${country} ${phone}`}
      footer={
        <div style={{ display:"flex", flexDirection:"column", gap:10, alignItems:"center" }}>
          {timer > 0
            ? <p style={{ fontFamily:"Jost", fontSize:12, color:"#8C7B6E" }}>Resend OTP in {timer}s</p>
            : <button style={F.link} onClick={() => { setOtp(["","","","","",""]); sendOTP(); }}>Resend OTP</button>
          }
          <button style={{ ...F.link, color:"#6B5744" }} onClick={() => { setStep("phone"); setErr(""); setOtp(["","","","","",""]); }}>
            ← Change number
          </button>
        </div>
      }
    >
      {err && <div style={F.err}>{err}</div>}

      {/* 6 OTP boxes */}
      <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:28 }} onPaste={handleOtpPaste}>
        {otp.map((d, i) => (
          <input
            key={i}
            id={`otp-${i}`}
            type="tel"
            maxLength={1}
            value={d}
            autoFocus={i === 0}
            onChange={e => handleOtpInput(i, e.target.value)}
            onKeyDown={e => handleOtpKey(i, e)}
            style={{
              width:46, height:56, textAlign:"center",
              fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500, color:"#1A1008",
              border: d ? "2px solid #1A1008" : "1.5px solid #E8E0D5",
              borderRadius:10, outline:"none", background:"#fff",
              transition:"border-color 0.2s",
            }}
          />
        ))}
      </div>

      <button onClick={() => verifyOTP(otp.join(""))} disabled={busy || otp.some(d => !d)} style={{
        width:"100%", height:52,
        background: busy ? "#B8A99A" : otp.every(d => d) ? "#1A1008" : "#E8E0D5",
        color: otp.every(d => d) ? "#FAF9F7" : "#8C7B6E",
        border:"none", fontFamily:"Jost", fontSize:12, fontWeight:600,
        letterSpacing:"0.15em", borderRadius:8,
        cursor: busy || otp.some(d => !d) ? "not-allowed" : "pointer",
        display:"flex", alignItems:"center", justifyContent:"center", gap:8,
        transition:"all 0.2s",
      }}>
        {busy ? "VERIFYING…" : <><IconCheck size={15}/> VERIFY</>}
      </button>
    </AuthCard>
  );
}

function AccountLayout({ active, children }) {
  const { navigate } = useApp();
  const user = window.auth.current?.user;

  async function logout() {
    if (!confirm("Sign out?")) return;
    await window.auth.logout();
    window.cartStore?.clearLocal();
    window.notifyAuthChange?.();
    navigate("home");
  }

  const menu = [
    { id:"account",   label:"Account Overview" },
    { id:"orders",    label:"My Orders" },
    { id:"addresses", label:"My Addresses" },
    { id:"profile",   label:"Profile Settings" },
  ];

  return (
    <div className="page-enter">
      <Navbar />
      <div style={{ minHeight:"80vh" }}>
        <div style={{ background:"#F7F3EE", borderBottom:"1px solid #EDE8E0", padding:"40px 0" }}>
          <div style={{ maxWidth:1280, margin:"0 auto", padding:"0 24px" }}>
            <p style={{ fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.18em", color:"#C5A468", marginBottom:8 }}>YOUR ACCOUNT</p>
            <h1 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:"clamp(28px,4vw,48px)", fontWeight:500, color:"#1A1008" }}>
              Hello, {user?.phone || user?.user_metadata?.full_name?.split(" ")[0] || "there"}
            </h1>
          </div>
        </div>
        <div style={{ maxWidth:1280, margin:"0 auto", padding:"40px 24px 80px" }}>
          <div style={{ display:"flex", gap:48, alignItems:"flex-start", flexWrap:"wrap" }}>
            <aside style={{ width:200, flexShrink:0 }}>
              {menu.map(m => (
                <button key={m.id} onClick={() => navigate(m.id)} style={{
                  display:"block", width:"100%", textAlign:"left",
                  background:"none", border:"none", cursor:"pointer",
                  fontFamily:"Jost", fontSize:13, padding:"12px 0",
                  borderBottom:"1px solid #EDE8E0",
                  color: active===m.id ? "#1A1008" : "#8C7B6E",
                  fontWeight: active===m.id ? 600 : 400,
                }}>
                  {m.label}
                </button>
              ))}
              <button onClick={logout} style={{
                display:"block", width:"100%", textAlign:"left",
                background:"none", border:"none", cursor:"pointer",
                fontFamily:"Jost", fontSize:13, padding:"12px 0", color:"#C0392B", marginTop:8,
              }}>Sign Out</button>
            </aside>
            <div style={{ flex:1, minWidth:280 }}>{children}</div>
          </div>
        </div>
      </div>
      <Footer />
    </div>
  );
}

/* ─── Account Dashboard ─────────────────────────────────────────── */

/* ─── Addresses Page ────────────────────────────────────────────── */
function AddressesPage() {
  const [addresses, setAddresses] = useState(null);
  const [showForm, setShowForm]   = useState(false);
  const [busy, setBusy]           = useState(false);
  const [err, setErr]             = useState("");
  const [form, setForm]           = useState({ label:"Home", full_name:"", phone:"", line1:"", line2:"", city:"", state:"", postal_code:"", country:"IN", is_default:false });

  useEffect(() => { window.auth.getAddresses().then(setAddresses); }, []);

  async function save(e) {
    e.preventDefault(); setErr(""); setBusy(true);
    try {
      const saved = await window.auth.addAddress(form);
      setAddresses(a => [saved, ...(a || [])]);
      setShowForm(false);
      /* Reset form for next use */
      setForm({ label:"Home", full_name:"", phone:"", line1:"", line2:"", city:"", state:"", postal_code:"", country:"IN", is_default:false });
    } catch(e2) { setErr(e2.message || "Could not save address. Please try again."); }
    finally { setBusy(false); }
  }

  async function remove(id) {
    if (!confirm("Delete this address?")) return;
    await window.auth.deleteAddress(id);
    setAddresses(a => a.filter(x => x.id !== id));
  }

  return (
    <AccountLayout active="addresses">
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:24, flexWrap:"wrap", gap:12 }}>
        <h2 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500 }}>Saved Addresses</h2>
        {!showForm && (
          <button onClick={() => setShowForm(true)} style={{
            background:"#1A1008", color:"#FAF9F7", border:"none",
            fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em",
            padding:"12px 22px", borderRadius:8, cursor:"pointer",
          }}>+ ADD ADDRESS</button>
        )}
      </div>

      {showForm && (
        <form onSubmit={save} style={{ background:"#F7F3EE", borderRadius:12, padding:24, marginBottom:24 }}>
          {err && <div style={F.err}>{err}</div>}
          <div className="two-col" style={{ gap:14, marginBottom:14 }}>
            <div><label style={F.label}>FULL NAME *</label><input required value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>PHONE *</label><input required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} style={F.input} /></div>
          </div>
          <div style={{ marginBottom:14 }}><label style={F.label}>ADDRESS LINE 1 *</label><input required value={form.line1} onChange={e=>setForm({...form,line1:e.target.value})} style={F.input} /></div>
          <div style={{ marginBottom:14 }}><label style={F.label}>ADDRESS LINE 2</label><input value={form.line2} onChange={e=>setForm({...form,line2:e.target.value})} style={F.input} /></div>
          <div style={{ display:"grid", gridTemplateColumns:"2fr 2fr 1fr", gap:14, marginBottom:18 }}>
            <div><label style={F.label}>CITY *</label><input required value={form.city} onChange={e=>setForm({...form,city:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>STATE *</label><input required value={form.state} onChange={e=>setForm({...form,state:e.target.value})} style={F.input} /></div>
            <div><label style={F.label}>PIN *</label><input required value={form.postal_code} onChange={e=>setForm({...form,postal_code:e.target.value})} style={F.input} /></div>
          </div>
          <div style={{ display:"flex", gap:10 }}>
            <button type="submit" disabled={busy} style={{ background:"#1A1008", color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer" }}>{busy ? "SAVING…" : "SAVE"}</button>
            <button type="button" onClick={() => setShowForm(false)} style={{ background:"transparent", color:"#1A1008", border:"1.5px solid #1A1008", fontFamily:"Jost", fontSize:12, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer" }}>CANCEL</button>
          </div>
        </form>
      )}

      {addresses === null && <p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>Loading…</p>}
      {addresses?.length === 0 && !showForm && (
        <div style={{ textAlign:"center", padding:"60px 20px", background:"#F7F3EE", borderRadius:12 }}>
          <div style={{ fontSize:40, marginBottom:14 }}>📍</div>
          <h3 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:24, fontWeight:500, marginBottom:10 }}>No saved addresses</h3>
          <button onClick={() => setShowForm(true)} style={{ background:"#1A1008", color:"#FAF9F7", border:"none", fontFamily:"Jost", fontSize:11, fontWeight:600, letterSpacing:"0.13em", padding:"12px 24px", borderRadius:8, cursor:"pointer", marginTop:14 }}>+ ADD ADDRESS</button>
        </div>
      )}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))", gap:16 }}>
        {addresses?.map(a => (
          <div key={a.id} style={{ background:"#fff", border:"1px solid #EDE8E0", borderRadius:12, padding:"20px 22px", position:"relative" }}>
            {a.is_default && <span style={{ position:"absolute", top:14, right:14, fontFamily:"Jost", fontSize:10, fontWeight:600, color:"#C5A468", background:"#FDF5E8", padding:"3px 10px", borderRadius:4 }}>DEFAULT</span>}
            <p style={{ fontFamily:"Jost", fontSize:10, fontWeight:600, letterSpacing:"0.13em", color:"#8C7B6E", marginBottom:8 }}>{a.label?.toUpperCase()}</p>
            <p style={{ fontFamily:"Jost", fontSize:14, fontWeight:600, color:"#1A1008", marginBottom:6 }}>{a.full_name}</p>
            <p style={{ fontFamily:"Jost", fontSize:13, color:"#6B5744", lineHeight:1.7 }}>{a.line1}{a.line2 && `, ${a.line2}`}<br/>{a.city}, {a.state} {a.postal_code}<br/>{a.phone}</p>
            <button onClick={() => remove(a.id)} style={{ marginTop:12, background:"none", border:"none", cursor:"pointer", fontFamily:"Jost", fontSize:12, color:"#C0392B", textDecoration:"underline", textUnderlineOffset:3 }}>Delete</button>
          </div>
        ))}
      </div>
    </AccountLayout>
  );
}

/* ─── Profile Page ──────────────────────────────────────────────── */
function ProfilePage() {
  const [profile, setProfile] = useState(null);
  const [form,    setForm]    = useState({ full_name:"", marketing_consent:false });
  const [busy,    setBusy]    = useState(false);
  const [success, setSuccess] = useState(false);
  const [err,     setErr]     = useState("");

  useEffect(() => {
    window.auth.getProfile().then(p => {
      setProfile(p);
      if (p) setForm({ full_name: p.full_name || "", marketing_consent: p.marketing_consent || false });
    });
  }, []);

  async function save(e) {
    e.preventDefault(); setErr(""); setSuccess(false); setBusy(true);
    try { await window.auth.updateProfile(form); setSuccess(true); setTimeout(() => setSuccess(false), 3000); }
    catch(e2) { setErr(e2.message); }
    finally { setBusy(false); }
  }

  if (!profile) return <AccountLayout active="profile"><p style={{ fontFamily:"Jost", fontSize:13, color:"#8C7B6E" }}>Loading…</p></AccountLayout>;

  return (
    <AccountLayout active="profile">
      <h2 style={{ fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:500, marginBottom:24 }}>Profile Settings</h2>
      <form onSubmit={save} style={{ maxWidth:480 }}>
        {err && <div style={F.err}>{err}</div>}
        {success && <div style={F.ok}>✓ Profile updated</div>}
        <div style={{ marginBottom:18 }}>
          <label style={F.label}>PHONE</label>
          <input value={window.auth.current?.user?.phone || ""} disabled style={{ ...F.input, background:"#F7F3EE", color:"#8C7B6E", cursor:"not-allowed" }} />
        </div>
        <div style={{ marginBottom:18 }}>
          <label style={F.label}>FULL NAME</label>
          <input value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} style={F.input} />
        </div>
        <label style={{ display:"flex", alignItems:"center", gap:10, fontFamily:"Jost", fontSize:13, color:"#6B5744", marginBottom:24, cursor:"pointer" }}>
          <input type="checkbox" checked={form.marketing_consent} onChange={e => setForm({...form, marketing_consent: e.target.checked})} />

  <script type="text/babel">
;(function(){
// app.jsx — Root app: cart state (persistent), router, context providers
const { useState, useEffect, useCallback } = React;
const {
  CartContext, AppContext,
  HomePage, ListingPage, DetailPage, CartPage, CheckoutPage, AboutPage, ContactPage,
  LoginPage, SignupPage, ForgotPasswordPage,
  AccountPage, OrdersPage, AddressesPage, ProfilePage,
  MobileBottomNav,
} = window;

/* ─── Cart helpers ──────────────────────────────────────────────── */
function makeKey(item) {
  return `${item.id}__${item.color}__${item.size}`;
}

/* ─── App ───────────────────────────────────────────────────────── */
function App() {
  /* ── Routing ──
     Real paths, not hashes: "/product/linen-veshti" rather than
     "#/detail?productId=<uuid>". Needs the SPA rewrite in vercel.json,
     which sends every non-/api path to this file.

     Without history integration the browser back button leaves the site
     entirely — a shopper on a product who presses back expects the
     listing, not to be thrown out of the store. */
  const pathToRoute = (pathname, search) => {
    const parts = pathname.replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
    const params = {};
    new URLSearchParams(search || "").forEach((v, k) => { params[k] = v; });

    if (!parts.length) return { page: "home", ...params };

    if (parts[0] === "product" && parts[1]) {
      /* Slug is the public handle; resolve to the id the app works with.
         Falls back to treating it as an id for links shared before a
         product was renamed. */
      const slug = decodeURIComponent(parts[1]);
      const hit  = (window.PRODUCTS || []).find(p => p.slug === slug || p.id === slug);
      return { page: "detail", productId: hit ? hit.id : slug, ...params };
    }
    if (parts[0] === "shop") return { page: "listing", ...params };
    return { page: parts[0], ...params };
  };

  const routeToPath = (page, params = {}) => {
    const rest = { ...params };
    let path;

    if (page === "detail") {
      const p = (window.PRODUCTS || []).find(x => x.id === params.productId);
      path = `/product/${encodeURIComponent(p?.slug || params.productId || "")}`;
      delete rest.productId;
    } else if (page === "listing") {
      path = "/shop";
    } else if (page === "home") {
      path = "/";
    } else {
      path = `/${page}`;
    }

    const qs = new URLSearchParams(
      Object.entries(rest).filter(([, v]) => v !== undefined && v !== null && v !== "")
    ).toString();
    return qs ? `${path}?${qs}` : path;
  };

  const [route, setRoute] = useState(() => {
    /* file:// and other non-http origins have no meaningful path — the
       pathname would be the folder on disk. Start at home there. */
    if (!/^https?:$/.test(window.location.protocol)) return { page: "home" };
    return pathToRoute(window.location.pathname, window.location.search);
  });

  const navigate = useCallback((page, params = {}) => {
    const url = routeToPath(page, params);
    /* Pushing to history is what gives us a working back button — but it
       must never be able to break navigation itself. Browsers reject
       pushState on file:// origins, and a throw here would stop the
       route from changing at all. */
    try {
      if (url !== window.location.pathname + window.location.search) {
        window.history.pushState(null, "", url);
      }
    } catch (e) {
      /* No history integration available; in-app navigation still works. */
    }
    setRoute({ page, ...params });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  /* Back / forward, including the Android hardware back key. */
  useEffect(() => {
    const onPop = () => {
      setRoute(pathToRoute(window.location.pathname, window.location.search));
      window.scrollTo({ top: 0, behavior: "auto" });
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  /* ── Cart (persistent across refreshes and devices) ── */
  const [cart,      setCart]      = useState(() => window.cartStore.loadLocal());
  const [cartReady, setCartReady] = useState(false);
  const [authVer,   setAuthVer]   = useState(0);   // increments on login/logout

  /* Expose a global notifier so login/signup/logout can refresh cart */
  useEffect(() => {
    window.notifyAuthChange = () => setAuthVer(v => v + 1);
    return () => { delete window.notifyAuthChange; };
  }, []);

  /* Load cart on mount AND whenever auth state changes (login/logout) */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      setCartReady(false);
      const local = window.cartStore.loadLocal();
      let merged = local;
      if (window.auth?.current) {
        const remote = await window.cartStore.loadRemote();
        merged = window.cartStore.mergeCarts(local, remote);
        if (!cancelled) await window.cartStore.saveRemote(merged);
      }
      if (cancelled) return;
      setCart(merged);
      window.cartStore.saveLocal(merged);
      setCartReady(true);
    })();
    return () => { cancelled = true; };
  }, [authVer]);

  /* Save cart on every change (debounced for DB) */
  useEffect(() => {
    if (!cartReady) return;
    window.cartStore.saveLocal(cart);
    if (window.auth?.current) {
      const t = setTimeout(() => window.cartStore.saveRemote(cart), 400);
      return () => clearTimeout(t);
    }
  }, [cart, cartReady]);

  const addToCart = useCallback((item) => {
    const key = makeKey(item);
    setCart(prev => {
      const existing = prev.find(i => i.cartKey === key);
      if (existing) {
        return prev.map(i =>
          i.cartKey === key
            ? { ...i, quantity: Math.min(i.quantity + item.quantity, 10) }
            : i
        );
      }
      return [...prev, { ...item, cartKey: key }];
    });
  }, []);

  const removeFromCart = useCallback((cartKey) => {
    setCart(prev => prev.filter(i => i.cartKey !== cartKey));
  }, []);

  const updateQuantity = useCallback((cartKey, qty) => {
    if (qty < 1) { removeFromCart(cartKey); return; }
    setCart(prev => prev.map(i => i.cartKey === cartKey ? { ...i, quantity: Math.min(qty, 10) } : i));
  }, [removeFromCart]);

  const clearCart = useCallback(() => {
    setCart([]);
    window.cartStore.clearAll();
  }, []);

  const cartTotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
  const cartCount = cart.reduce((sum, i) => sum + i.quantity, 0);

  /* ── Contexts ── */
  const cartCtx = { cart, cartTotal, cartCount, addToCart, removeFromCart, updateQuantity, clearCart };
  const appCtx  = { route, navigate };

  /* ── Render current page ── */
  function renderPage() {
    /* Account routes require login — redirect to /login if not authenticated */
    const accountRoutes = ["account", "orders", "addresses", "profile"];
    if (accountRoutes.includes(route.page) && !window.auth?.current) {
      return <LoginPage />;
    }

    switch (route.page) {
      case "home":      return <HomePage />;
      case "listing":   return <ListingPage key={route.listFilter + (route.searchQuery||"")} />;
      case "detail":    return <DetailPage  key={route.productId} />;
      case "cart":      return <CartPage />;
      case "checkout":  return <CheckoutPage />;
      case "about":     return <AboutPage />;
      case "contact":   return <ContactPage />;
      case "login":     return <LoginPage />;
      case "signup":    return <SignupPage />;
      case "forgot":    return <ForgotPasswordPage />;
      case "account":   return <AccountPage />;
      case "orders":    return <OrdersPage />;
      case "addresses": return <AddressesPage />;
      case "profile":   return <ProfilePage />;
      default:          return <HomePage />;
    }
  }

  return (
    <CartContext.Provider value={cartCtx}>
      <AppContext.Provider value={appCtx}>
        {renderPage()}
        {MobileBottomNav ? <MobileBottomNav /> : null}
      </AppContext.Provider>
    </CartContext.Provider>
  );
}

/* Load live products from Supabase, THEN mount React.
   Hard timeout: mount no matter what after 5 seconds.
   Falls back to an empty product list if the DB is unreachable. */
function setLoaderStatus(msg, color) {
  const status = document.getElementById("kanka-loader-status");
  if (status) {
    status.textContent = msg;
    if (color) status.style.color = color;
  }
}

let mounted = false;
function mountKanka() {
  if (mounted) return;
  mounted = true;
  const loader = document.getElementById("kanka-loader");
  try {
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  } catch (e) {
    console.error("[Kanka] Render error:", e);
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;text-align:center;font-family:Jost,sans-serif;color:#C0392B">' +
      'Something went wrong. Please refresh the page.<br><br>' +
      '<small>' + e.message + '</small></div>';
  }
  /* Hold until the letter stagger and rule finish, then lift the whole
     panel upward to reveal the page. */
  if (loader) {
    setTimeout(() => {
      loader.style.transform = "translateY(-100%)";
      setTimeout(() => loader.remove(), 800);
    }, 1400);
  }
}

/* Hard timeout: mount within 5s even if DB doesn't respond */
const hardTimeout = setTimeout(() => {
  console.warn("[Kanka] Hard timeout — mounting with fallback data");
  setLoaderStatus("Loading…", "#C5A468");
  mountKanka();
}, 5000);

setLoaderStatus("Loading products…");
window.loadKankaData()
  .then(() => {
    clearTimeout(hardTimeout);
    setLoaderStatus("Almost ready…");
    mountKanka();
  })
  .catch((err) => {
    clearTimeout(hardTimeout);
    console.error("[Kanka] DB load failed:", err.message);
    setLoaderStatus("Database unreachable. Loading site…", "#C0392B");
    setTimeout(mountKanka, 800);
  });

})();
  </script>
